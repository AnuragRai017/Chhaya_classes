  shell("Home",`<div class="wrap" id="flWrap"></div>`);
  FL={bank:shuffle(pool).slice(0,15),i:0,cor:0,timer:null,left:20};
  flRender();
}
function flRender(){
  const q=FL.bank[FL.i];const el=$("#flWrap");
  if(!q){flDone(el);return;}
  FL.left=20;clearInterval(FL.timer);
  el.innerHTML=`<span class="kick">⚡ QWEN FLASH · ${bi("High-Speed Engine","High-Speed Engine")}</span>
    <h1 class="title">${bi("Rapid-Fire Drill","Rapid-Fire Drill")}</h1>
    <div class="mockbar">
      <span class="chip">${bi("Question","प्रश्न")} ${FL.i+1}/${FL.bank.length}</span>
      <span class="chip">⭐ ${FL.cor}</span>
      <span class="timer" id="flTimer">20s</span>
    </div>
    <div class="qcard">
      <div class="qtext" style="margin-bottom:12px">${q.q_hi?bi(q.q,q.q_hi):q.q}</div>
      ${(q.o_hi||q.o).map((o,j)=>`<button class="opt" onclick="APP.flAnswer(${j})">${label(o,j,q)}</button>`).join("")}
      <div id="flRationale"></div>
    </div>
    <div class="mp-nav"><a class="btn ghost" href="#/">${bi("Exit","बाहर")}</a><span></span></div>`;
  FL.timer=setInterval(()=>{
    FL.left--;const t=$("#flTimer");if(t)t.textContent=FL.left+"s";
    if(FL.left<=0){APP.flAnswer(-1);}
  },1000);
}
APP.flAnswer=j=>{
  if(FL.answered)return;FL.answered=true;
  clearInterval(FL.timer);
  const q=FL.bank[FL.i];
  const ok=j===q.a;if(ok)FL.cor++;
  const opts=$$("#flWrap .opt");
  opts.forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add("ok");if(k===j&&!ok)b.classList.add("no");});
  if(j===-1)$("#flRationale").innerHTML=`<div class="rationale"><div class="rh">⏰ ${bi("Time up!","समय समाप्त!")}</div><div>${q.exp_hi?bi(q.exp,q.exp_hi):q.exp}</div></div>`;
  else $("#flRationale").innerHTML=rationaleHTML(q,ok);
  review30(()=>{FL.i++;FL.answered=false;flRender();},"#flWrap");
};
function flDone(el){
  clearInterval(FL.timer);
  el.innerHTML=`<div class="card" style="text-align:center;padding:40px">
    <div style="font-size:3rem">⚡</div><h2 class="sec">${bi("Flash Drill Complete","Flash Drill पूर्ण")}</h2>
    <p class="sub">${bi("Score:","स्कोर:")} ${FL.cor} / ${FL.bank.length}</p>
    <a class="btn" href="#/" style="margin-top:14px">${bi("Back Home","Home पर वापस")}</a>
  </div>`;
}

/* ================================================================
   MOCK TEST
================================================================ */
let MK=null;
APP.startMock=()=>{mockView(true)};
function mockIntro(){
  shell("Mock",`<div class="wrap">
    <span class="kick">📝 ${bi("Full Mock Test","पूर्ण Mock Test")}</span>
    <h1 class="title">${bi("Exam Simulation","Exam Simulation")}</h1>
    <p class="sub">${bi("120 questions · 120 minutes · +3 correct, −1 wrong. Section I (GK/Reasoning) = 30, Section II (Social Studies) = 90.","120 प्रश्न · 120 मिनट · +3 सही, −1 गलत। खण्ड I (GK/Reasoning) = 30, खण्ड II (सामाजिक अध्ययन) = 90।")}</p>
    <div class="examgrid">
      <div class="c"><b>${Math.min(30,poolCount("A"))}</b><small>${bi("Section I available","खण्ड I उपलब्ध")}</small></div>
      <div class="c"><b>${Math.min(90,poolCount("B"))}</b><small>${bi("Section II available","खण्ड II उपलब्ध")}</small></div>
      <div class="c"><b>120</b><small>${bi("Minutes","मिनट")}</small></div>
      <div class="c"><b>−1</b><small>${bi("Negative marking","Negative")}</small></div>
    </div>
    <button class="btn" style="margin-top:20px" onclick="APP.startMock()">${bi("Start Mock Test","Mock Test शुरू करें")} 🚀</button>
  </div>`);
}
function poolCount(sec){return sec==="A"?qsOfSubject("gk").length+qsOfSubject("reason").length:qsOfSubject("ss").length}
function mockView(start){
  const a=shuffle(qsOfSubject("gk").concat(qsOfSubject("reason")));
  const b=shuffle(qsOfSubject("ss"));
  const sec1=a.slice(0,30), sec2=b.slice(0,90);
  const qs=sec1.concat(sec2);
  if(!qs.length){toast("No questions available yet.","r");return;}
  MK={qs,i:0,answers:[],left:120*60,timer:null,sec1:sec1.length,sec2:sec2.length};
  shell("Mock",`<div class="wrap" id="mkWrap"></div>`);
  MK.timer=setInterval(()=>{
    MK.left--;const t=$("#mkTimer");if(t){const m=Math.floor(MK.left/60),s=MK.left%60;t.textContent=(m<10?"0":"")+m+":"+(s<10?"0":"")+s;}
    if(MK.left<=0)mockFinish();
  },1000);
  mkRender();
}
function mkRender(){
  const i=MK.i,q=MK.qs[i];const el=$("#mkWrap");
  if(i>=MK.qs.length){mockFinish();return;}
  const inSec2=i>=MK.sec1;
  el.innerHTML=`<span class="kick">📝 ${bi("Mock Test","Mock Test")} · ${inSec2?bi("Section II","खण्ड II"):bi("Section I","खण्ड I")}</span>
    <div class="mockbar">
      <span class="chip">${bi("Question","प्रश्न")} ${i+1}/${MK.qs.length}</span>
      <span class="timer" id="mkTimer"></span>
    </div>
    <div class="qcard">
      <div class="qtext" style="margin-bottom:12px">${q.q_hi?bi(q.q,q.q_hi):q.q}</div>
      ${(q.o_hi||q.o).map((o,j)=>`<button class="opt" onclick="APP.mkAnswer(${j})">${label(o,j,q)}</button>`).join("")}
    </div>
    <div class="qnav">
      <button class="btn ghost sm" ${i===0?"disabled":""} onclick="APP.mkPrev()">← ${bi("Prev","पिछला")}</button>
      <button class="btn sm" onclick="APP.mkNext()">${bi("Next","आगे")} →</button>
    </div>
    <div class="mgrid">
      ${MK.qs.map((_,k)=>`<button class="${k===i?"cur":""} ${MK.answers[k]!=null?(MK.answers[k]===MK.qs[k].a?"done-c":"done-w"):""}" onclick="APP.mkJump(${k})">${k+1}</button>`).join("")}
    </div>
    <button class="btn gold" style="margin-top:12px" onclick="APP.mkSubmit()">${bi("Submit Test","Test Submit करें")} ✅</button>`;
}
APP.mkAnswer=j=>{if(MK.answers[MK.i]!=null)return;MK.answers[MK.i]=j;mkRender();};
APP.mkPrev=()=>{if(MK.i>0){MK.i--;mkRender();}};
APP.mkNext=()=>{if(MK.i<MK.qs.length-1){MK.i++;mkRender();}else mockFinish();};
APP.mkJump=k=>{MK.i=k;mkRender();};
APP.mkSubmit=()=>{if(confirm("Submit the mock test? आप सबमिट करना चाहते हैं?"))mockFinish();};
function mockFinish(){
  clearInterval(MK.timer);
  const qs=MK.qs,ans=MK.answers;
  let cor=0,att=0;ans.forEach((a,i)=>{if(a!=null){att++;if(a===qs[i].a)cor++;}});
  const wrong=att-cor;
  const score=cor*3-wrong*1;
  const byTopic={};
  ans.forEach((a,i)=>{const q=qs[i];if(a!=null&&a!==q.a){byTopic[q.topic]=(byTopic[q.topic]||0)+1;S.weak[q.topic]=(S.weak[q.topic]||0)+1;S.mistakes.push({m:q.mid||"mock",q:i,topic:q.topic,ts:Date.now()});}});
  S.stats.att+=att;S.stats.cor+=cor;save();award("mock");checkBadges();
  const weakRows=Object.entries(byTopic).sort((a,b)=>b[1]-a[1]).slice(0,6);
  shell("Mock",`<div class="wrap">
    <span class="kick">📝 ${bi("Result","परिणाम")}</span>
    <h1 class="title">${bi("Mock Test Analysis","Mock Test विश्लेषण")}</h1>
    <div class="examgrid">
      <div class="c"><b>${cor}</b><small>${bi("Correct","सही")}</small></div>
      <div class="c"><b>${wrong}</b><small>${bi("Wrong","गलत")}</small></div>
      <div class="c"><b>${att}</b><small>${bi("Attempted","प्रयास")}</small></div>
      <div class="c"><b style="color:${score>=0?"var(--green)":"var(--red)"}">${score}</b><small>${bi("Score (×3 −1)","स्कोर")}</small></div>
    </div>
    <div class="card" style="margin-top:20px">
      <h2 class="sec">${bi("Weak Topics","कमज़ोर Topics")}</h2>
      ${weakRows.length?`<div class="weaklist">${weakRows.map(([t,n])=>`<div class="w"><span style="flex:1;font-weight:700">${t}</span><div class="bar"><i style="width:${Math.min(100,n*20)}%;background:var(--red)"></i></div><b>${n}</b></div>`).join("")}</div>`:`<p class="sub">${bi("No mistakes — excellent!","कोई गलती नहीं — शानदार!")}</p>`}
    </div>
    <div class="mp-nav"><a class="btn" href="#/">${bi("Home","Home")}</a><a class="btn gold" href="#/progress">${bi("See Progress","Progress देखें")} →</a></div>
  </div>`);
}

/* ================================================================
   PROGRESS
================================================================ */
function progressView(){
  const done=S.done.length,total=MODULES.length;
  const pct=total?Math.round(done/total*100):0;
  const acc=S.stats.att?Math.round(S.stats.cor/S.stats.att*100):0;
  const weak=Object.entries(S.weak).sort((a,b)=>b[1]-a[1]);
  const recent=(S.mistakes||[]).slice(-8).reverse();
  const perSubject=SUBJECTS.filter(s=>!s.locked).map(s=>{
    const ms=MODULES.filter(m=>m.subject===s.id);const d=ms.filter(m=>S.done.includes(m.id)).length;
    return {s,d,total:ms.length};
  });
  shell("Progress",`<div class="wrap">
    <span class="kick">📊 ${bi("Your Progress","आपकी Progress")}</span>
    <h1 class="title">${bi("Dashboard","Dashboard")}</h1>
    <div class="pgrid">
      <div>
        <div class="card" style="display:flex;align-items:center;gap:24px;flex-wrap:wrap">
          <div class="ring" style="background:conic-gradient(var(--ind) ${pct*3.6}deg, var(--line) 0)"><div style="text-align:center"><b>${pct}%</b><small>${bi("Complete","पूर्ण")}</small></div></div>
          <div style="flex:1;min-width:200px">
            <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px">
              <span class="chip">⭐ <b>${S.xp}</b> XP</span>
              <span class="chip">🏆 Level <b>${level()}</b></span>
              <span class="chip">🔥 <b>${S.streak}</b>-day</span>
              <span class="chip">🎯 <b>${acc}%</b> ${bi("accuracy","accuracy")}</span>
            </div>
            <div class="bar"><i style="width:${pct}%"></i></div>
            <small style="color:var(--ink2)">${done}/${total} ${bi("modules","modules")} · ${bi("Next level:","अगला level:")} ${xpForNext()} XP</small>
          </div>
        </div>
        <div style="margin-top:20px"><h2 class="sec">${bi("Subject Progress","विषय Progress")}</h2>
          <div class="doors" style="grid-template-columns:1fr;margin-top:12px">
            ${perSubject.map(({s,d,total})=>`<div class="door" style="display:flex;align-items:center;gap:14px;padding:16px">
              <span style="font-size:1.6rem">${s.e}</span>
              <div style="flex:1"><b>${bi(s.name,s.hi)}</b>
              <div class="bar" style="margin-top:6px"><i style="width:${total?Math.round(d/total*100):0}%"></i></div></div>
              <span class="chip">${d}/${total}</span>
            </div>`).join("")}
          </div>
        </div>
      </div>
      <div>
        <div class="card"><h2 class="sec" style="font-size:1.2rem">🏅 ${bi("Badges","Badges")}</h2>
          <div class="bgrid" style="margin-top:12px">
            ${BADGES.map(b=>`<div class="bdg ${S.badges.includes(b.id)?"got":""}"><span class="em">${b.e}</span><b>${b.t}</b><small>${b.d}</small></div>`).join("")}
          </div>
        </div>
        <div class="card" style="margin-top:16px"><h2 class="sec" style="font-size:1.2rem">🎯 ${bi("Weak Topics","कमज़ोर Topics")}</h2>
          ${weak.length?`<div class="weaklist">${weak.slice(0,6).map(([t,n])=>`<div class="w"><span style="flex:1;font-weight:700;font-size:.9rem">${t}</span><b style="color:var(--red)">${n}</b></div>`).join("")}</div>`:`<p class="sub" style="font-size:.85rem">${bi("No weak topics recorded yet.","अभी कोई कमज़ोर topic दर्ज नहीं।")}</p>`}
        </div>
      </div>
    </div>
    ${recent.length?`<div class="card" style="margin-top:20px"><h2 class="sec" style="font-size:1.2rem">🧾 ${bi("Recent Mistakes","हाल की गलतियाँ")}</h2>
      <div class="weaklist">${recent.map(r=>`<div class="w"><span style="flex:1;font-size:.9rem">${r.topic}</span><span class="tag t-red">${bi("Module","Module")} ${esc(r.m)}</span></div>`).join("")}</div>
      <button class="btn sm gold" style="margin-top:12px" onclick="APP.resetAll()">${bi("Reset Progress","Progress रीसेट करें")} ↺</button>
    </div>`:""}
  </div>`);
}
APP.resetAll=()=>{if(confirm("Reset all progress? सारी progress मिट जाएगी।")){S=JSON.parse(JSON.stringify(DEF));S.last=new Date().toDateString();save();progressView();}};

/* ================================================================
   ROUTE
================================================================ */
function route(){
  const h=location.hash||"#/";
  const parts=h.replace(/^#\//,"").split("/");
  const seg=parts[0];
  document.querySelector("header")?.classList.remove("nav-open");
  if(seg===""||seg==="home")homeView();
  else if(seg==="subjects")subjectsView();
  else if(seg==="subject")subjectsView();
  else if(seg==="roadmap")roadmapView();
  else if(seg==="module")moduleView(parts[1]);
  else if(seg==="deepseek")deepseekView();
  else if(seg==="flash")flashView();
  else if(seg==="mock")mockIntro();
  else if(seg==="progress")progressView();
  else homeView();
}
window.addEventListener("hashchange",route);
route();
</script>
