<!DOCTYPE html>
<html lang="hi" data-theme="light" data-fs="2" data-motion="on">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pariksha Guru — UP सहायक अध्यापक 2026 Exam Prep</title>
<meta name="description" content="Interactive 90-day exam prep for UP Higher Primary School Assistant Teacher (Class 6–8) 2026 — GK, Reasoning, Social Studies, Science-Math & Language with adaptive quizzes.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700;800&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --paper:#FAF7EF; --card:#FFFFFF; --ink:#1C2340; --ink2:#555C7C; --line:#E7E1D1;
  --ind:#2F47B3; --ind-deep:#22357F; --ind-soft:#E7ECFB;
  --gold:#FFB020; --gold-soft:#FFF1D2; --gold-deep:#B87A00;
  --green:#1F9D62; --green-soft:#E2F6EB; --red:#E4572E; --red-soft:#FDE8E1;
  --purp:#7A4FD3; --purp-soft:#F0E8FC; --teal:#0E9B9B; --teal-soft:#DFF6F6;
  --sh:0 10px 30px -12px rgba(34,45,90,.18);
  --sh-lg:0 24px 50px -20px rgba(34,45,90,.28);
  --disp:'Baloo 2','Noto Sans Devanagari',cursive;
  --body:'Manrope','Noto Sans Devanagari',sans-serif;
  --hand:'Kalam','Noto Sans Devanagari',cursive;
  --r:16px;
}
html[data-fs="1"]{font-size:14px} html[data-fs="2"]{font-size:16px} html[data-fs="3"]{font-size:18px}
html[data-theme="dark"]{
  --paper:#101427; --card:#1A1F3A; --ink:#EDEBFF; --ink2:#A9AFD6; --line:#2C3358;
  --ind:#7B8DF0; --ind-deep:#9DA9F7; --ind-soft:#232B54; --gold-soft:#3A2F14;
  --green-soft:#123B2A; --red-soft:#43201A; --purp-soft:#2C2150; --teal-soft:#103a3a;
  --sh:0 10px 30px -12px rgba(0,0,0,.55); --sh-lg:0 24px 50px -20px rgba(0,0,0,.65);
}
*{margin:0;padding:0;box-sizing:border-box}
html[data-motion="off"] *{animation:none!important;transition:none!important}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--paper);color:var(--ink);line-height:1.6;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(600px 380px at 88% -6%, rgba(255,176,32,.14), transparent 65%),
             radial-gradient(700px 460px at -8% 22%, rgba(47,71,179,.10), transparent 60%),
             repeating-linear-gradient(0deg, transparent 0 34px, rgba(47,71,179,.045) 34px 35px);}
::selection{background:var(--gold);color:#231a00}
a{color:var(--ind);text-decoration:none}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
body[data-lang="en"] .hi{display:none} body[data-lang="hi"] .en{display:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px;position:relative;z-index:1}

/* ============ HEADER ============ */
header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--paper) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:14px;padding:10px 22px;max-width:1240px;margin:0 auto;flex-wrap:wrap;row-gap:8px}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo .lc{width:44px;height:44px;border-radius:50%;background:var(--gold);display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:1.35rem;color:#231a00;box-shadow:0 4px 0 var(--gold-deep)}
.logo b{font-family:var(--disp);font-size:1.2rem;font-weight:800;line-height:1.05;display:block}
.logo small{display:block;font-size:.68rem;color:var(--ink2);letter-spacing:.06em}
nav.main{display:flex;gap:2px;margin-left:8px;flex-wrap:wrap}
nav.main a{display:block;padding:9px 13px;border:0;background:none;font-weight:700;font-size:.92rem;color:var(--ink);border-radius:10px;position:relative}
nav.main a::after{content:"";position:absolute;left:13px;right:13px;bottom:4px;height:3px;border-radius:3px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:.25s}
nav.main a:hover::after,nav.main a.on::after{transform:scaleX(1)}
.hd-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:999px;font-weight:700;font-size:.8rem;color:var(--ink2)}
.seg button.on{background:var(--ind);color:#fff}
.icobtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card);font-size:1.05rem;display:grid;place-items:center;transition:.2s}
.icobtn:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.burger{display:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;place-items:center;padding:9px 0;margin-left:auto}
.burger span{display:block;width:20px;height:2.5px;border-radius:99px;background:var(--ink);margin:2.5px auto;transition:.28s}

/* bottom nav mobile */
#bnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:55;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
#bnav .row{display:flex}
#bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:.64rem;font-weight:700;color:var(--ink2);border-radius:12px}
#bnav a.on{color:var(--ind)}

/* ============ GENERIC ============ */
.kick{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-deep);background:var(--gold-soft);padding:6px 14px;border-radius:999px;margin-bottom:14px}
html[data-theme="dark"] .kick{color:var(--gold)}
h1.title{font-family:var(--disp);font-weight:800;font-size:clamp(2rem,4.5vw,3.2rem);line-height:1.08;letter-spacing:-.01em}
h2.sec{font-family:var(--disp);font-weight:800;font-size:clamp(1.6rem,3.2vw,2.3rem);line-height:1.15}
.sub{color:var(--ink2);max-width:64ch;margin-top:8px}
.btn{display:inline-flex;align-items:center;gap:9px;border:0;padding:13px 24px;border-radius:13px;font-family:var(--disp);font-weight:700;font-size:1rem;transition:.2s;text-decoration:none;color:#fff;background:var(--ind);box-shadow:0 4px 0 var(--ind-deep)}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ind-deep),var(--sh)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ind-deep)}
.btn.gold{background:var(--gold);color:#231a00;box-shadow:0 4px 0 var(--gold-deep)}
.btn.gold:hover{box-shadow:0 6px 0 var(--gold-deep),var(--sh)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line);border:1px solid var(--line)}
.btn.green{background:var(--green);box-shadow:0 4px 0 #147145}
.btn.purp{background:var(--purp);box-shadow:0 4px 0 #5b3aa6}
.btn.teal{background:var(--teal);box-shadow:0 4px 0 #0a6f6f}
.btn.sm{padding:8px 15px;font-size:.88rem;border-radius:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--sh);transition:transform .25s,box-shadow .25s}
.card.hov:hover{transform:translateY(-5px);box-shadow:var(--sh-lg)}
.tag{display:inline-block;font-size:.72rem;font-weight:800;padding:3px 10px;border-radius:99px;letter-spacing:.03em}
.t-blue{background:var(--ind-soft);color:var(--ind)} .t-yel{background:var(--gold-soft);color:var(--gold-deep)}
.t-grn{background:var(--green-soft);color:var(--green)} .t-red{background:var(--red-soft);color:var(--red)}
.t-pur{background:var(--purp-soft);color:var(--purp)} .t-teal{background:var(--teal-soft);color:var(--teal)}
html[data-theme="dark"] .t-yel{color:var(--gold)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ind),var(--purp));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.view{display:block;padding:34px 0 70px;animation:vin .4s cubic-bezier(.2,.8,.2,1)}
@keyframes vin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 13px;font-weight:700;font-size:.82rem}
.note{display:flex;gap:14px;align-items:flex-start;background:var(--gold-soft);border:1px dashed var(--gold);border-radius:14px;padding:14px 16px}
.tips{background:var(--gold-soft);border:1px dashed var(--gold);border-radius:14px;padding:16px 18px}
.tips h4{font-family:var(--disp);color:var(--gold-deep)}
html[data-theme="dark"] .tips h4{color:var(--gold)}

/* ============ HOME ============ */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:36px;align-items:center;padding:34px 0 22px}
.h-kick{display:inline-flex;gap:8px;align-items:center;font-weight:800;font-size:.8rem;background:var(--ind-soft);color:var(--ind);border-radius:99px;padding:7px 15px;margin-bottom:16px}
.h-kick .dotp{width:8px;height:8px;border-radius:99px;background:var(--green);animation:bl 1.4s infinite}
@keyframes bl{50%{opacity:.2}}
.h-sub{margin:18px 0 24px;color:var(--ink2);font-size:1.05rem;max-width:52ch}
.h-cta{display:flex;gap:14px;flex-wrap:wrap}
.statline{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0 8px}
.statline .chip b{color:var(--ind)}
.eboard{background:linear-gradient(160deg,#173B34,#0F2B26);border:10px solid #8A5A2B;border-radius:10px;color:#F2EEDF;font-family:var(--hand);box-shadow:var(--sh-lg);padding:24px 24px 32px;position:relative;transform:rotate(-1.2deg)}
.eboard::after{content:"";position:absolute;left:12%;right:12%;bottom:-10px;height:10px;border-radius:0 0 8px 8px;background:#6f4820}
.eboard .bh{font-size:1.1rem;opacity:.85;letter-spacing:.06em}
.eboard .big{font-size:clamp(1.6rem,3.2vw,2.2rem);font-weight:700;margin:6px 0 4px}

/* exam info strip */
.examgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:24px}
.examgrid .c{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center;box-shadow:var(--sh)}
.examgrid .c b{font-family:var(--disp);font-size:1.5rem;display:block}
.examgrid .c small{color:var(--ink2);font-weight:600}

/* subject doors */
.doors{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:24px}
.door{border-radius:20px;padding:24px;position:relative;overflow:hidden;border:1px solid var(--line);background:var(--card);box-shadow:var(--sh);transition:.3s}
.door:hover{transform:translateY(-6px);box-shadow:var(--sh-lg)}
.door.locked{opacity:.55;pointer-events:none}
.door .em{font-size:2rem}
.door h3{font-family:var(--disp);font-size:1.3rem;font-weight:800;margin:8px 0 2px}
.door p{font-size:.88rem;color:var(--ink2)}
.door .strip{height:8px;border-radius:99px;margin-bottom:10px}

/* ============ ROADMAP ============ */
.rdgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:22px}
.rday{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 12px;cursor:pointer;transition:.2s;text-align:center;position:relative}
.rday:hover{transform:translateY(-3px);box-shadow:var(--sh)}
.rday .dn{font-family:var(--disp);font-weight:800;font-size:.78rem;color:var(--gold-deep)}
html[data-theme="dark"] .rday .dn{color:var(--gold)}
.rday .df{font-size:.78rem;font-weight:700;line-height:1.25;display:block;margin-top:4px;color:var(--ink)}
.rday .dt{font-size:.66rem;color:var(--ink2)}
.rday.done{border-color:var(--green);background:var(--green-soft)}
.rday.done::after{content:"✓";position:absolute;top:6px;right:8px;color:var(--green);font-weight:800}
.rday.lock{opacity:.45}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:.8rem;color:var(--ink2);font-weight:600}

/* ============ MODULE PLAYER ============ */
.mp-top{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.mp-top h1{font-family:var(--disp);font-size:clamp(1.4rem,3vw,2rem)}
.stepbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.stepbar .st{font-size:.76rem;font-weight:800;border-radius:99px;padding:6px 13px;background:var(--card);border:1px solid var(--line);color:var(--ink2)}
.stepbar .st.act{background:var(--ind);color:#fff;border-color:var(--ind)}
.stepbar .st.done{background:var(--green-soft);color:var(--green);border-color:transparent}
.mp-card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh-lg);padding:clamp(20px,4vw,36px);min-height:340px;animation:stepIn .4s cubic-bezier(.2,.8,.2,1)}
@keyframes stepIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.mp-nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:12px}
.point{display:flex;gap:12px;align-items:flex-start;margin:10px 0}
.point .ic{flex-shrink:0;width:28px;height:28px;border-radius:8px;background:var(--ind-soft);color:var(--ind);display:grid;place-items:center;font-weight:800;font-size:.85rem}
.point .tx{flex:1}
.ddbox{background:var(--purp-soft);border-left:5px solid var(--purp);border-radius:12px;padding:16px 18px;margin:14px 0}
.ddbox h4{font-family:var(--disp);color:var(--purp)}
html[data-theme="dark"] .ddbox h4{color:#b7a0f0}
.formula{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.formula .fx{font-family:var(--disp);font-weight:800;background:var(--ind-soft);color:var(--ind);padding:9px 16px;border-radius:12px;font-size:1.05rem}

/* ============ QUIZ ============ */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.qnum{font-weight:800;font-size:.85rem;color:var(--ink2)}
.timer{font-family:var(--disp);font-weight:800;font-size:1.3rem;color:var(--red)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--sh)}
.qtext{font-size:1.08rem;font-weight:600;line-height:1.65}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:13px;padding:13px 16px;font-weight:600;font-size:.96rem;margin:10px 0;transition:.16s;font-family:inherit;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--ind);transform:translateX(4px)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--green);background:var(--green-soft)}
.opt.no{border-color:var(--red);background:var(--red-soft);animation:shk .35s}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.rationale{background:var(--ind-soft);border-radius:14px;padding:16px 18px;margin-top:16px;animation:vin .3s}
.rationale .rh{font-family:var(--disp);font-weight:800;margin-bottom:6px}
.rationale .why{list-style:none;margin-top:10px;display:grid;gap:6px}
.rationale .why li{padding-left:22px;position:relative;font-size:.88rem;color:var(--ink2)}
.rationale .why li::before{content:"✗";position:absolute;left:0;color:var(--red);font-weight:800}
.qnav{display:flex;justify-content:space-between;gap:12px;margin-top:18px}
.cotstep{background:var(--purp-soft);border-radius:12px;padding:12px 16px;margin:8px 0;font-size:.92rem;animation:vin .3s;border-left:4px solid var(--purp)}
.cotstep b{color:var(--purp)}
.reviewbar{display:flex;align-items:center;gap:12px;background:var(--gold-soft);border:1px dashed var(--gold);border-radius:12px;padding:12px 14px;margin-top:14px;animation:vin .3s}
.reviewbar .rl{font-weight:800;font-size:.9rem}
.reviewbar b{font-family:var(--disp);font-size:1.35rem;color:var(--red);min-width:52px;text-align:center}
.reviewbar .btn{margin-left:auto}

/* ============ MOCK ============ */
.mockbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:14px 0}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px;margin:10px 0}
.mgrid button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-weight:800;font-size:.8rem;color:var(--ink)}
.mgrid button.cur{outline:2px solid var(--ind)}
.mgrid button.done-c{background:var(--green);color:#fff;border-color:var(--green)}
.mgrid button.done-w{background:var(--red);color:#fff;border-color:var(--red)}
.mgrid button.done-s{background:var(--gold);color:#231a00;border-color:var(--gold)}

/* ============ PROGRESS ============ */
.pgrid{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-top:22px}
.ring{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;position:relative;margin:0 auto}
.ring::before{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--card)}
.ring b{position:relative;font-family:var(--disp);font-size:1.3rem}
.ring small{position:relative;font-size:.62rem;color:var(--ink2);text-align:center;font-weight:700}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.bdg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 12px;text-align:center;transition:.25s}
.bdg .em{font-size:1.9rem;display:block;filter:grayscale(1);opacity:.35}
.bdg.got{border-color:var(--gold);background:var(--gold-soft)}
.bdg.got .em{filter:none;opacity:1;animation:pop .5s}
@keyframes pop{40%{transform:scale(1.35) rotate(-8deg)}}
.bdg b{font-family:var(--disp);font-size:.88rem;display:block;margin-top:6px}
.bdg small{color:var(--ink2);font-size:.72rem}
.weaklist{display:grid;gap:10px;margin-top:14px}
.weaklist .w{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.weaklist .w .bar{flex:1}

/* toasts / fx */
#toasts{position:fixed;right:18px;bottom:18px;z-index:120;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--gold);border-radius:14px;padding:13px 18px;box-shadow:var(--sh-lg);font-weight:700;font-size:.92rem;animation:tin .4s;max-width:320px}
.toast.g{border-left-color:var(--green)}.toast.r{border-left-color:var(--red)}.toast.p{border-left-color:var(--purp)}
@keyframes tin{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
.xpfloat{position:fixed;z-index:130;font-family:var(--disp);font-weight:800;color:var(--gold-deep);background:var(--gold);padding:4px 12px;border-radius:99px;pointer-events:none;animation:xf 1.2s forwards;font-size:.95rem}
html[data-theme="dark"] .xpfloat{color:#231a00}
@keyframes xf{to{transform:translateY(-70px);opacity:0}}
.cf{position:fixed;width:9px;height:14px;z-index:129;pointer-events:none;animation:cff 1.1s ease-out forwards}
@keyframes cff{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rr));opacity:0}}

footer{border-top:1px solid var(--line);padding:30px 0 90px;position:relative;z-index:1;background:color-mix(in srgb,var(--paper) 70%,transparent)}
footer .cols{display:flex;gap:24px;flex-wrap:wrap;justify-content:space-between;align-items:center}
footer small{color:var(--ink2)}

/* ============ RESPONSIVE ============ */
@media(max-width:1000px){
  .burger{display:grid}
  nav.main{position:absolute;top:calc(100% - 1px);left:0;right:0;z-index:56;display:flex;flex-direction:column;align-items:stretch;gap:2px;margin:0;padding:8px 16px calc(12px + env(safe-area-inset-bottom));background:var(--paper);border-bottom:1px solid var(--line);box-shadow:var(--sh-lg);opacity:0;visibility:hidden;transform:translateY(-8px);transition:.22s;max-height:calc(100dvh - 80px);overflow-y:auto}
  header.nav-open nav.main{opacity:1;visibility:visible;transform:none}
  header.nav-open{z-index:60}
  nav.main a{padding:11px 8px;font-size:1rem}
  nav.main a.on::after{display:none}
  .hero{grid-template-columns:1fr;padding-top:22px}
  .examgrid{grid-template-columns:repeat(2,1fr)}
  .doors{grid-template-columns:1fr}
  .pgrid{grid-template-columns:1fr}
  .rdgrid{grid-template-columns:repeat(3,1fr)}
  #bnav{display:block}
  footer{padding-bottom:120px}
}
@media(max-width:560px){
  .rdgrid{grid-template-columns:repeat(2,1fr)}
  .examgrid{grid-template-columns:1fr 1fr}

{id:"cineq",subject:"reason",day:2,level:2,title:"Coded Inequalities",hi:"कोड असमानताएँ (Coded Inequalities)",
 concepts:[{title:"Coded Inequalities — decode the symbols",title_hi:"कोड असमानताएँ — प्रतीक समझें",
  intro:"Symbols are assigned to mathematical relations (>, <, ≥, ≤, =). Decode them and check whether a conclusion follows.",
  points:["सामान्य कोड: @ = >, # = ≥, $ = =, % = <, & = ≤ (हमेशा प्रश्न में दिया होता है)","बड़ा-छोटा क्रम: > = बड़ा, < = छोटा","≥ का अर्थ 'बड़ा या बराबर', ≤ का 'छोटा या बराबर'","निष्कर्ष (conclusion) तभी सत्य जब पूरी chain से निश्चित हो"],
  example:"A @ B (A > B), B $ C (B = C) → A > C निश्चित रूप से सत्य",
  trick:"पहले सभी symbols को असली चिह्न में बदल लें, फिर एक संख्या-रेखा जैसा क्रम बनाएँ।",
  deep:{title:"'Definitely true' vs 'possible'",title_hi:"'निश्चित' vs 'संभव'",body:"परीक्षा में सबसे बड़ा जाल है: जो conclusion 'हो सकता है' वह 'निश्चित' नहीं। उत्तर वही चुनें जो दी गई असमानता से हर स्थिति में सिद्ध हो।",extra:"याद रखें: यदि chain में A > B = C ≥ D है, तो A > D तो सत्य है, पर B > D केवल 'हो सकता है' — क्योंकि B = C ≥ D में बराबरी भी संभव है।"},
  check:{q:"If '@' means '>', then 'A @ B' means:",q_hi:"यदि '@' का अर्थ '>' है, तो 'A @ B' का अर्थ है:",o:["A is less than B","A is greater than B","A equals B","A ≤ B"],o_hi:["A, B से छोटा","A, B से बड़ा","A = B","A ≤ B"],a:1,exp:"'@' decodes to '>', so A is greater than B.",exp_hi:"'@' का डिकोड '>' है, अतः A, B से बड़ा है।"}}],
 questions:[
 {q:"If '@' = >, '#' = ≥, '$' = =. Given A @ B and B $ C, which is definitely true?",q_hi:"यदि '@' = >, '#' = ≥, '$' = =। दिया है A @ B और B $ C, तो निश्चित रूप से सत्य कौन-सा है?",o:["A > C","A < C","A = C","A ≤ C"],o_hi:["A > C","A < C","A = C","A ≤ C"],a:0,exp:"A > B and B = C, so A > C.",exp_hi:"A > B और B = C, अतः A > C।",why:["A < C गलत — A बड़ा है","A = C तभी होता यदि A = B","A ≤ C गलत दिशा"],topic:"Coded inequality",level:2,mode:"deepseek",steps:["'@' को '>' में बदलें: A > B","'$' को '=' में बदलें: B = C","तो A > B = C","यानी A > C निश्चित रूप से सत्य"]},
 {q:"If '%' = < and '&' = ≤. Given X % Y and Y & Z, which is definitely true?",q_hi:"यदि '%' = < और '&' = ≤। दिया है X % Y और Y & Z, तो निश्चित रूप से सत्य कौन-सा है?",o:["X < Z","X > Z","X = Z","X ≥ Z"],o_hi:["X < Z","X > Z","X = Z","X ≥ Z"],a:0,exp:"X < Y and Y ≤ Z, so X < Z.",exp_hi:"X < Y और Y ≤ Z, अतः X < Z।",why:["X > Z विपरीत है","X = Z निश्चित नहीं","X ≥ Z गलत"],topic:"Coded inequality",level:2,mode:"standard"},
 {q:"If '#' = ≥ and '$' = =. Given P # Q and Q $ R, which is definitely true?",q_hi:"यदि '#' = ≥ और '$' = =। दिया है P # Q और Q $ R, तो निश्चित रूप से सत्य कौन-सा है?",o:["P ≥ R","P > R","P < R","P = R"],o_hi:["P ≥ R","P > R","P < R","P = R"],a:0,exp:"P ≥ Q and Q = R, so P ≥ R.",exp_hi:"P ≥ Q और Q = R, अतः P ≥ R।",why:["P > R निश्चित नहीं (बराबर भी हो सकता)","P < R गलत","P = R निश्चित नहीं"],topic:"Coded inequality",level:2,mode:"standard"}]},

{id:"ar",subject:"reason",day:3,level:2,title:"Assertion & Reason",hi:"कथन और कारण (Assertion & Reason)",
 concepts:[{title:"Assertion (A) and Reason (R)",title_hi:"कथन (A) और कारण (R)",
  intro:"Two statements are given: an Assertion (A) and a Reason (R). Decide if each is true, and whether R correctly explains A.",
  points:["चरण 1: क्या A अपने आप सत्य है?","चरण 2: क्या R अपने आप सत्य है?","चरण 3: यदि दोनों सत्य, तो क्या R, A की सही व्याख्या करता है?","चार विकल्प: (a) दोनों सत्य, R सही व्याख्या (b) दोनों सत्य, R व्याख्या नहीं (c) A सत्य, R असत्य (d) A असत्य, R सत्य"],
  example:"A: चंद्रमा का अपना प्रकाश नहीं होता। R: चंद्रमा सूर्य के प्रकाश को परावर्तित करता है। → (a) दोनों सत्य, R सही व्याख्या",
  trick:"पहले हर कथन को स्वतंत्र रूप से सत्य/असत्य जाँचें — फिर 'क्योंकि' (because) लगाकर देखें कि R वाकई A का कारण बनता है या नहीं।",
  deep:{title:"True but unrelated trap",title_hi:"सत्य पर असंबंधित जाल",body:"सबसे आम गलती: दोनों कथन सत्य हैं, लेकिन R, A का कारण नहीं। तब उत्तर (b) होता है, (a) नहीं। हमेशा 'क्योंकि' की कड़ी जाँचें।",extra:"विज्ञान/भूगोल के कथनों में तथ्यात्मक सत्यता पहले जाँचें; तर्कशक्ति में तार्किक संबंध।"},
  check:{q:"If A is true and R is true but R does not explain A, the answer is:",q_hi:"यदि A सत्य, R सत्य पर R, A की व्याख्या नहीं करता, तो उत्तर है:",o:["(a)","(b)","(c)","(d)"],o_hi:["(a)","(b)","(c)","(d)"],a:1,exp:"Both true but unrelated → option (b).",exp_hi:"दोनों सत्य पर असंबंधित → विकल्प (b)।"}}],
 questions:[
 {q:"A: The Moon has no light of its own. R: The Moon reflects sunlight.",q_hi:"A: चंद्रमा का अपना प्रकाश नहीं होता। R: चंद्रमा सूर्य का प्रकाश परावर्तित करता है।",o:["Both true, R explains A","Both true, R does not explain A","A true, R false","A false, R true"],o_hi:["दोनों सत्य, R व्याख्या करता है","दोनों सत्य, R व्याख्या नहीं","A सत्य, R असत्य","A असत्य, R सत्य"],a:0,exp:"Both are true, and reflection of sunlight IS the reason the Moon shines without its own light.",exp_hi:"दोनों सत्य हैं, और सूर्य के प्रकाश का परावर्तन ही वह कारण है कि चंद्रमा बिना अपने प्रकाश के चमकता है।",why:["R वास्तव में A की व्याख्या करता है","दोनों सत्य हैं, कोई असत्य नहीं","A भी सत्य है"],topic:"Assertion-Reason",level:2,mode:"deepseek",steps:["जाँचें A: क्या चंद्रमा का अपना प्रकाश है? नहीं — सत्य","जाँचें R: क्या चंद्रमा सूर्य का प्रकाश परावर्तित करता है? हाँ — सत्य","क्या R, A का कारण है? चंद्रमा इसीलिए चमकता है क्योंकि वह सूर्य-प्रकाश परावर्तित करता है","अतः (a) दोनों सत्य, R सही व्याख्या"]},
 {q:"A: Water boils at 100°C at sea level. R: Atmospheric pressure is lower at higher altitudes.",q_hi:"A: समुद्र तल पर जल 100°C पर उबलता है। R: अधिक ऊँचाई पर वायुमंडलीय दाब कम होता है।",o:["Both true, R explains A","Both true, R does not explain A","A true, R false","A false, R true"],o_hi:["दोनों सत्य, R व्याख्या करता है","दोनों सत्य, R व्याख्या नहीं","A सत्य, R असत्य","A असत्य, R सत्य"],a:1,exp:"Both are true, but R (about high altitude) does not explain why water boils at 100°C at sea level.",exp_hi:"दोनों सत्य हैं, पर R (ऊँचाई का दाब) यह व्याख्या नहीं करता कि समुद्र तल पर जल 100°C पर क्यों उबलता है।",why:["R, A का सीधा कारण नहीं है","A सत्य है, असत्य नहीं","R सत्य है, असत्य नहीं"],topic:"Assertion-Reason",level:3,mode:"standard"},
 {q:"A: Plants need sunlight. R: Sunlight provides energy for photosynthesis.",q_hi:"A: पौधों को सूर्य-प्रकाश चाहिए। R: प्रकाश-संश्लेषण के लिए सूर्य-प्रकाश ऊर्जा देता है।",o:["Both true, R explains A","Both true, R does not explain A","A true, R false","A false, R true"],o_hi:["दोनों सत्य, R व्याख्या करता है","दोनों सत्य, R व्याख्या नहीं","A सत्य, R असत्य","A असत्य, R सत्य"],a:0,exp:"Both true, and photosynthesis is the reason plants need sunlight.",exp_hi:"दोनों सत्य, और प्रकाश-संश्लेषण ही वह कारण है जिससे पौधों को सूर्य-प्रकाश चाहिए।",why:["R, A की सही व्याख्या है","दोनों सत्य हैं","A सत्य है"],topic:"Assertion-Reason",level:2,mode:"standard"}]},

{id:"binary",subject:"reason",day:3,level:3,title:"Binary Logic",hi:"बाइनरी लॉजिक (Binary Logic)",
 concepts:[{title:"Binary Logic — truth-tellers & liars",title_hi:"बाइनरी लॉजिक — सत्यवादी व झूठे",
  intro:"People either ALWAYS tell the truth, ALWAYS lie, or alternate. Deduce the truth from their statements.",
  points:["सत्यवादी (Truth-teller): हर कथन सत्य","झूठा (Liar): हर कथन असत्य","अल्टरनेटर: क्रम से सत्य-झूठ बोलता है","कथनों को एक-दूसरे से जाँचें, मान लें कोई कौन है और सत्यता जाँचें"],
  example:"दो दरवाज़े, एक सत्यवादी एक झूठा। पूछें: 'दूसरा कौन-सा दरवाज़ा सही बताएगा?' — दोनों गलत दरवाज़ा बताएँगे, इसलिए उसका उल्टा चुनें।",
  trick:"प्रत्येक व्यक्ति को बारी-बारी से सत्यवादी मानकर देखें — जिस मान्यता पर सभी कथन टिक जाएँ, वही सही।",
  deep:{title:"The classic two-guards riddle",title_hi:"दो-रक्षकों की पहेली",body:"एक रक्षक सदा सत्य, दूसरा सदा झूठ। एक प्रश्न में सही दरवाज़ा जानने के लिए पूछें: 'यदि मैं दूसरे रक्षक से पूछूँ कि कौन-सा दरवाज़ा सुरक्षित है, तो वह क्या बताएगा?' दोनों ही गलत दरवाज़ा बताएँगे — अतः उसका उल्टा चुनें।",extra:"यह 'नकार द्वारा सत्य' (double negation) का सिद्धांत है — झूठा सत्यवादी के उत्तर को उलट देता है।"},
  check:{q:"A truth-teller always speaks:",q_hi:"सत्यवादी सदा बोलता है:",o:["Only lies","The truth","Sometimes truth","Silence"],o_hi:["केवल झूठ","सत्य","कभी सत्य","मौन"],a:1,exp:"A truth-teller always tells the truth.",exp_hi:"सत्यवादी सदा सत्य बोलता है।"}}],
 questions:[
 {q:"Two guards: one always truthful, one always lying. You ask the liar 'Which door is safe?' He will point to:",q_hi:"दो रक्षक: एक सदा सत्य, एक सदा झूठ। झूठे से पूछें 'कौन-सा दरवाज़ा सुरक्षित है?' वह बताएगा:",o:["The safe door","The unsafe door","Either door","Both doors"],o_hi:["सुरक्षित दरवाज़ा","असुरक्षित दरवाज़ा","कोई भी","दोनों"],a:1,exp:"A liar always lies, so he points to the unsafe door.",exp_hi:"झूठा सदा झूठ बोलता है, इसलिए वह असुरक्षित दरवाज़ा बताएगा।",why:["सुरक्षित दरवाज़ा तो सत्यवादी बताता","'कोई भी' निर्धारित नहीं","'दोनों' असंभव है"],topic:"Truth-lie puzzle",level:2,mode:"deepseek",steps:["झूठा हमेशा झूठ बोलता है","सुरक्षित दरवाज़ा सत्य होता","झूठा सत्य को उलट देगा","अतः वह असुरक्षित दरवाज़ा बताएगा"]},
 {q:"A says: 'B is a liar.' B says: 'A is truthful.' If only one of them is lying, who is the liar?",q_hi:"A कहता है: 'B झूठा है।' B कहता है: 'A सत्यवादी है।' यदि केवल एक झूठा है, तो कौन?",o:["A","B","Both","Neither"],o_hi:["A","B","दोनों","कोई नहीं"],a:0,exp:"Assume B is truthful: then B's statement 'A is truthful' is true, making both truthful — contradiction with 'only one liar'. So B is lying and A is truthful.",exp_hi:"मानें B सत्यवादी है: तो B का कथन 'A सत्यवादी है' सत्य, यानी दोनों सत्य — यह 'केवल एक झूठा' से विरोधाभासी है। अतः B झूठा और A सत्यवादी।",why:["B झूठा है","'दोनों' शर्त के विरुद्ध","'कोई नहीं' शर्त के विरुद्ध"],topic:"Truth-lie puzzle",level:3,mode:"standard"},
 {q:"In binary logic, an 'alternator' is someone who:",q_hi:"बाइनरी लॉजिक में 'अल्टरनेटर' वह है जो:",o:["Always lies","Always tells truth","Alternates truth and lie","Never speaks"],o_hi:["सदा झूठ","सदा सत्य","क्रम से सत्य-झूठ","कभी नहीं बोलता"],a:2,exp:"An alternator alternates between true and false statements.",exp_hi:"अल्टरनेटर क्रम से सत्य और झूठ बोलता है।",why:["सदा झूठ 'liar' होता है","सदा सत्य 'truth-teller' होता है","न बोलने वाला प्रश्न में नहीं होता"],topic:"Binary logic types",level:1,mode:"standard"}]},

{id:"clock",subject:"reason",day:4,level:2,title:"Clocks & Calendars",hi:"घड़ियाँ एवं कैलेंडर (Clocks & Calendars)",
 concepts:[{title:"Clocks & Calendars — angles & days",title_hi:"घड़ियाँ व कैलेंडर — कोण व दिन",
  intro:"Solve angle-between-hands and day-of-week problems using fixed formulas.",
  points:["घंटे की सुई: 1 मिनट में 0.5°, 1 घंटे में 30°","मिनट की सुई: 1 मिनट में 6°","कोण = |30H − 5.5M| (जहाँ H=घंटा, M=मिनट)","लीप वर्ष: 4 से विभाज्य (पर 100 से विभाज्य हो तो 400 से भी)","सामान्य वर्ष में 1 दिन, लीप वर्ष में 2 दिन आगे बढ़ते हैं"],
  example:"3:00 बजे कोण = 30×3 = 90°; 6:00 पर = 180°",
  trick:"कोण सूत्र |30H − 5.5M| याद रखें; 180° से बड़ा आए तो 360 से घटाकर छोटा कोण लें।",
  deep:{title:"Day-of-week and leap rules",title_hi:"दिन-गणना व लीप नियम",body:"किसी तिथि का दिन निकालने के लिए odd-days विधि: 100 वर्ष = 5 odd days, 200 वर्ष = 3, 300 वर्ष = 1, 400 वर्ष = 0। शताब्दी लीप वर्ष तभी जब 400 से विभाज्य हो — इसलिए 1900 लीप नहीं, 2000 लीप था।",extra:"15 अगस्त 1947 शुक्रवार था; 26 जनवरी 1950 शुक्रवार था — ये परीक्षा के प्रिय तथ्य हैं।"},
  check:{q:"Angle between the hands of a clock at 3:00 is:",q_hi:"3:00 बजे घड़ी की सुइयों के बीच का कोण है:",o:["30°","60°","90°","120°"],o_hi:["30°","60°","90°","120°"],a:2,exp:"At 3:00 the hour hand is at 3 (3×30° = 90°).",exp_hi:"3:00 बजे घंटे की सुई 3 पर (3×30° = 90°)।"}}],
 questions:[
 {q:"Angle between the clock hands at 6:00 is:",q_hi:"6:00 बजे घड़ी की सुइयों के बीच का कोण है:",o:["90°","180°","270°","360°"],o_hi:["90°","180°","270°","360°"],a:1,exp:"At 6:00 the hands are opposite — 6×30° = 180°.",exp_hi:"6:00 बजे सुइयाँ विपरीत — 6×30° = 180°।",why:["90° 3:00 पर होता","270° बड़ा कोण है (छोटा 90°)","360° पूर्ण घूर्णन है"],topic:"Clock angle",level:1,mode:"standard"},
 {q:"Angle between the clock hands at 3:30 is:",q_hi:"3:30 बजे घड़ी की सुइयों के बीच का कोण है:",o:["75°","90°","105°","60°"],o_hi:["75°","90°","105°","60°"],a:0,exp:"|30×3 − 5.5×30| = |90 − 165| = 75°.",exp_hi:"|30×3 − 5.5×30| = |90 − 165| = 75°।",why:["90° केवल 3:00 पर","105° गलत गणना","60° 2:00 पर"],topic:"Clock angle",level:2,mode:"deepseek",steps:["सूत्र: |30H − 5.5M|","H=3, M=30 रखें","30×3 = 90; 5.5×30 = 165","|90 − 165| = 75°"]},
 {q:"Which of these is a leap year?",q_hi:"इनमें से कौन-सा लीप वर्ष है?",o:["1900","2000","1800","2100"],o_hi:["1900","2000","1800","2100"],a:1,exp:"Century years must be divisible by 400. Only 2000 qualifies.",exp_hi:"शताब्दी वर्ष 400 से विभाज्य होना चाहिए। केवल 2000 ही योग्य है।",why:["1900, 400 से विभाज्य नहीं","1800, 400 से विभाज्य नहीं","2100, 400 से विभाज्य नहीं"],topic:"Leap year",level:1,mode:"standard"},
 {q:"How many odd days are there in a normal (non-leap) year?",q_hi:"सामान्य वर्ष में कितने odd days होते हैं?",o:["0","1","2","7"],o_hi:["0","1","2","7"],a:1,exp:"365 days = 52 weeks + 1 day, so 1 odd day.",exp_hi:"365 दिन = 52 सप्ताह + 1 दिन, अतः 1 odd day।",why:["0 लीप नहीं, 400 वर्षों में होता","2 लीप वर्ष में होते","7 odd days = 0 odd days (सप्ताह पूर्ण)"],topic:"Calendar",level:1,mode:"standard"}]},
{id:"hist",subject:"gk",day:5,level:1,title:"Indian History & National Movement",hi:"भारतीय इतिहास व राष्ट्रीय आन्दोलन",
 concepts:[{title:"Freedom movement — key dates",title_hi:"स्वतंत्रता आन्दोलन — मुख्य तिथियाँ",
  intro:"Master the landmark events, leaders and dates of the Indian National Movement.",

{id:"polity",subject:"gk",day:7,level:1,title:"Polity & Governance",hi:"राजनीति एवं शासन",

  intro:"Fundamentals of the Indian Constitution, political system and local governance.",

  example:"पंचायती राज का त्रि-स्तर: ग्राम पंचायत → पंचायत समिति → ज़िला परिषद",

  check:{q:"Who is the constitutional head of the Indian state (Union)?",q_hi:"भारतीय संघ का संवैधानिक प्रमुख कौन है?",o:["Prime Minister","President","Chief Justice","Speaker"],o_hi:["प्रधानमंत्री","राष्ट्रपति","मुख्य न्यायाधीश","अध्यक्ष (स्पीकर)"],a:1,exp:"The President is the constitutional head of the state.",exp_hi:"राष्ट्रपति राज्य का संवैधानिक प्रमुख है।"}}],
 questions:[

 {q:"The 73rd Constitutional Amendment (1992) is related to:",q_hi:"73वाँ संवैधानिक संशोधन (1992) किससे संबंधित है?",o:["Municipalities","Panchayati Raj","GST","Anti-defection"],o_hi:["नगरपालिकाएँ","पंचायती राज","GST","दल-बदल विरोधी"],a:1,exp:"The 73rd Amendment gave constitutional status to Panchayati Raj.",exp_hi:"73वें संशोधन ने पंचायती राज को संवैधानिक दर्जा दिया।",why:["नगरपालिकाएँ 74वें संशोधन से","GST 101वें संशोधन से","दल-बदल 52वें संशोधन से"],topic:"Panchayati Raj",level:1,mode:"standard"},
 {q:"Article 40 of the Constitution deals with:",q_hi:"संविधान का अनुच्छेद 40 किससे संबंधित है?",o:["Organisation of village panchayats","Right to education","Uniform civil code","Protection of minorities"],o_hi:["ग्राम पंचायतों का संगठन","शिक्षा का अधिकार","समान नागरिक संहिता","अल्पसंख्यकों की सुरक्षा"],a:0,exp:"Article 40 (DPSP) directs the state to organise village panchayats.",exp_hi:"अनुच्छेद 40 (DPSP) राज्य को ग्राम पंचायतों के संगठन का निर्देश देता है।",why:["शिक्षा का अधिकार अनुच्छेद 21A है","समान नागरिक संहिता अनुच्छेद 44 है","अल्पसंख्यक संरक्षण अनुच्छेद 29-30 है"],topic:"DPSP",level:2,mode:"standard"}]},

{id:"econ",subject:"gk",day:8,level:1,title:"Economy & Social Development",hi:"अर्थव्यवस्था व सामाजिक विकास",

 {q:"Sustainable development means development that:",q_hi:"सतत विकास का अर्थ है ऐसा विकास जो:",o:["Meets present needs without harming future generations","Grows fastest","Uses maximum resources","Benefits only the rich"],o_hi:["वर्तमान ज़रूरतें पूरी करे, भविष्य को नुकसान पहुँचाए बिना","सबसे तेज़ बढ़े","अधिकतम संसाधन खर्च करे","केवल अमीरों को लाभ दे"],a:0,exp:"Sustainable development meets today's needs without compromising future generations.",exp_hi:"सतत विकास आज की ज़रूरतें पूरी करता है, भविष्य की पीढ़ियों से समझौता किए बिना।",why:["सिर्फ़ तेज़ विकास सतत नहीं","अधिकतम संसाधन-उपयोग असतत है","केवल अमीरों को लाभ असमावेशी है"],topic:"Development",level:1,mode:"standard"},
 {q:"Which committee is associated with poverty estimation in India?",q_hi:"भारत में गरीबी आकलन से कौन-सी समिति जुड़ी है?",o:["Tendulkar Committee","Kothari Committee","Mandal Committee","Sarkaria Committee"],o_hi:["तेंदुलकर समिति","कोठारी समिति","मंडल समिति","सरकारिया समिति"],a:0,exp:"The Tendulkar Committee (2009) set the methodology for poverty estimation.",exp_hi:"तेंदुलकर समिति (2009) ने गरीबी आकलन की पद्धति निर्धारित की।",why:["कोठारी समिति शिक्षा से जुड़ी है","मंडल समिति आरक्षण से जुड़ी है","सरकारिया समिति केन्द्र-राज्य संबंधों से जुड़ी है"],topic:"Poverty",level:2,mode:"standard"},
 {q:"How many Sustainable Development Goals (SDGs) did the UN adopt in 2015?",q_hi:"संयुक्त राष्ट्र ने 2015 में कितने सतत विकास लक्ष्य (SDGs) अपनाए?",o:["8","12","17","21"],o_hi:["8","12","17","21"],a:2,exp:"The UN adopted 17 Sustainable Development Goals in 2015.",exp_hi:"संयुक्त राष्ट्र ने 2015 में 17 सतत विकास लक्ष्य अपनाए।",why:["8 पुराने MDGs की संख्या थी","12 कम है","21 अधिक है"],topic:"Development",level:2,mode:"standard"}]},

{id:"env",subject:"gk",day:9,level:1,title:"Environment, Ecology & Climate",hi:"पर्यावरण, पारिस्थितिकी व जलवायु",
 concepts:[{title:"Ecology, biodiversity & climate change",title_hi:"पारिस्थितिकी, जैव विविधता व जलवायु परिवर्तन",
  intro:"Key environmental concepts, biodiversity and climate agreements.",
  points:["जैव विविधता: किसी क्षेत्र में जीवों की विविधता","ग्रीनहाउस प्रभाव: CO2, मीथेन जैसी गैसें गर्मी रोकती हैं","ओजोन परत UV किरणों से बचाती है","भारत के जैव विविधता हॉटस्पॉट: पश्चिमी घाट, हिमालय, इंडो-बर्मा, सुंडालैंड","जलवायु परिवर्तन: मुख्य कारण ग्रीनहाउस गैस उत्सर्जन"],
  example:"मॉन्ट्रियल प्रोटोकॉल (1987): ओजोन क्षरणकारी पदार्थों (CFC) पर रोक",
  trick:"मॉन्ट्रियल = ओज़ोन; क्योटो = ग्रीनहाउस गैस — यह जोड़ याद रखें।",
  deep:{title:"Climate agreements at a glance",title_hi:"जलवायु समझौते एक नज़र में",body:"क्योटो प्रोटोकॉल (1997) — विकसित देशों के लिए ग्रीनहाउस गैस कटौती के बाध्यकारी लक्ष्य। पेरिस समझौता (2015) — ग्लोबल वार्मिंग को 2°C से नीचे (1.5°C लक्ष्य) रखना।",extra:"चिपको आन्दोलन (1973) वृक्षों की सुरक्षा हेतु; सुंदरलाल बहुगुणा प्रमुख नेता।"},
  check:{q:"The Montreal Protocol (1987) protects which layer?",q_hi:"मॉन्ट्रियल प्रोटोकॉल (1987) किस परत की रक्षा करता है?",o:["Troposphere","Ozone layer","Ionosphere","Exosphere"],o_hi:["क्षोभमण्डल","ओजोन परत","आयनमण्डल","बाह्यमण्डल"],a:1,exp:"The Montreal Protocol phases out ozone-depleting substances.",exp_hi:"मॉन्ट्रियल प्रोटोकॉल ओजोन-क्षरणकारी पदार्थों पर रोक लगाता है।"}}],
 questions:[
 {q:"Which gas is the largest contributor to the greenhouse effect?",q_hi:"ग्रीनहाउस प्रभाव में सबसे बड़ा योगदान किस गैस का है?",o:["Oxygen","Carbon dioxide","Nitrogen","Hydrogen"],o_hi:["ऑक्सीजन","कार्बन डाइऑक्साइड","नाइट्रोजन","हाइड्रोजन"],a:1,exp:"Carbon dioxide (CO2) is the largest contributor to the enhanced greenhouse effect.",exp_hi:"कार्बन डाइऑक्साइड (CO2) ग्रीनहाउस प्रभाव में सबसे बड़ा योगदानकर्ता है।",why:["ऑक्सीजन ग्रीनहाउस गैस नहीं","नाइट्रोजन ग्रीनहाउस गैस नहीं","हाइड्रोजन ग्रीनहाउस गैस नहीं"],topic:"Climate",level:1,mode:"standard"},
 {q:"Which of these is a biodiversity hotspot in India?",q_hi:"इनमें से कौन-सा भारत का जैव विविधता हॉटस्पॉट है?",o:["Thar Desert","Western Ghats","Deccan Plateau","Gangetic Plain"],o_hi:["थार मरुस्थल","पश्चिमी घाट","दक्कन पठार","गंगा का मैदान"],a:1,exp:"The Western Ghats is one of India's four biodiversity hotspots.",exp_hi:"पश्चिमी घाट भारत के चार जैव विविधता हॉटस्पॉट में से एक है।",why:["थार मरुस्थल हॉटस्पॉट नहीं","दक्कन पठार हॉटस्पॉट नहीं","गंगा का मैदान हॉटस्पॉट नहीं"],topic:"Biodiversity",level:1,mode:"standard"},
 {q:"The ozone layer protects the Earth from:",q_hi:"ओजोन परत पृथ्वी की रक्षा किससे करती है?",o:["Infrared rays","Ultraviolet rays","X-rays","Radio waves"],o_hi:["अवरक्त किरणें","पराबैंगनी किरणें","X-किरणें","रेडियो तरंगें"],a:1,exp:"The ozone layer absorbs harmful ultraviolet (UV) radiation.",exp_hi:"ओजोन परत हानिकारक पराबैंगनी (UV) विकिरण को अवशोषित करती है।",why:["अवरक्त गर्मी से संबंधित है","X-किरणें वायुमंडल में अवशोषित होती हैं","रेडियो तरंगें हानिकारक नहीं"],topic:"Ozone",level:1,mode:"standard"},
 {q:"The Kyoto Protocol is related to:",q_hi:"क्योटो प्रोटोकॉल किससे संबंधित है?",o:["Ozone depletion","Greenhouse gas reduction","Biodiversity","Desertification"],o_hi:["ओजोन क्षरण","ग्रीनहाउस गैस कटौती","जैव विविधता","मरुस्थलीकरण"],a:1,exp:"The Kyoto Protocol set binding targets to reduce greenhouse gas emissions.",exp_hi:"क्योटो प्रोटोकॉल ने ग्रीनहाउस गैस उत्सर्जन घटाने के बाध्यकारी लक्ष्य तय किए।",why:["ओजोन मॉन्ट्रियल से है","जैव विविधता CBD से है","मरुस्थलीकरण UNCCD से है"],topic:"Climate agreements",level:2,mode:"standard"}]},

{id:"sci",subject:"gk",day:10,level:1,title:"General Science & Current Affairs",hi:"सामान्य विज्ञान व समसामयिक",
 concepts:[{title:"Everyday science essentials",title_hi:"दैनिक विज्ञान के मूल तत्व",
  intro:"Science in daily life: vitamins, units, elements and atmosphere.",
  points:["विटामिन C की कमी → स्कर्वी; विटामिन D की कमी → रिकेट्स","बल की SI इकाई: न्यूटन (N)","सोने का रासायनिक प्रतीक: Au (ऑरम)","वायु में सबसे अधिक गैस: नाइट्रोजन (लगभग 78%)","पौधों का भोजन-निर्माण: प्रकाश-संश्लेषण (photosynthesis)"],
  example:"प्रकाश-संश्लेषण: CO2 + जल + सूर्य-प्रकाश → ग्लूकोज़ + ऑक्सीजन",
  trick:"'Au' सोना = 'और' कीमती; 'Ag' चाँदी = 'अज' (silver की चमक) — ऐसे जोड़ बनाएँ।",
  deep:{title:"Current affairs — how to prepare",title_hi:"समसामयिक — कैसे तैयार करें",body:"समसामयिकी (Current Affairs) समय-संवेदी होती है। पिछले 6–12 महीने की राष्ट्रीय-अंतर्राष्ट्रीय घटनाएँ, खेल पुरस्कार, नई नियुक्तियाँ, और प्रमुख सम्मेलन नियमित रूप से अपडेट करें।",extra:"परीक्षा की तिथि के अनुसार इस module को ताज़ा करते रहें — यह डेटा-चालित है और आसानी से अपडेट हो सकता है।"},
  check:{q:"Which vitamin deficiency causes scurvy?",q_hi:"किस विटामिन की कमी से स्कर्वी होता है?",o:["Vitamin A","Vitamin B","Vitamin C","Vitamin D"],o_hi:["विटामिन A","विटामिन B","विटामिन C","विटामिन D"],a:2,exp:"Vitamin C deficiency causes scurvy (bleeding gums).",exp_hi:"विटामिन C की कमी से स्कर्वी (मसूड़ों से खून) होता है।"}}],
 questions:[
 {q:"The SI unit of force is:",q_hi:"बल की SI इकाई है:",o:["Joule","Newton","Watt","Pascal"],o_hi:["जूल","न्यूटन","वाट","पास्कल"],a:1,exp:"Force is measured in newtons (N).",exp_hi:"बल न्यूटन (N) में मापा जाता है।",why:["जूल ऊर्जा/कार्य की इकाई है","वाट शक्ति की इकाई है","पास्कल दाब की इकाई है"],topic:"Physics",level:1,mode:"standard"},
 {q:"Which is the most abundant gas in the atmosphere?",q_hi:"वायुमंडल में सबसे अधिक मात्रा में कौन-सी गैस है?",o:["Oxygen","Carbon dioxide","Nitrogen","Hydrogen"],o_hi:["ऑक्सीजन","कार्बन डाइऑक्साइड","नाइट्रोजन","हाइड्रोजन"],a:2,exp:"Nitrogen makes up about 78% of the atmosphere.",exp_hi:"नाइट्रोजन वायुमंडल का लगभग 78% है।",why:["ऑक्सीजन लगभग 21% है","CO2 बहुत कम (~0.04%) है","हाइड्रोजन अत्यंत कम है"],topic:"Chemistry",level:1,mode:"standard"},
 {q:"The chemical symbol for gold is:",q_hi:"सोने का रासायनिक प्रतीक है:",o:["Ag","Au","Fe","Gd"],o_hi:["Ag","Au","Fe","Gd"],a:1,exp:"Gold's symbol is Au (from Latin 'aurum').",exp_hi:"सोने का प्रतीक Au है (लैटिन 'ऑरम' से)।",why:["Ag चाँदी है","Fe लोहा है","Gd गैडोलिनियम है"],topic:"Chemistry",level:1,mode:"standard"},
 {q:"Photosynthesis primarily occurs in which part of a plant?",q_hi:"प्रकाश-संश्लेषण मुख्यतः पौधे के किस भाग में होता है?",o:["Root","Leaf","Stem","Flower"],o_hi:["जड़","पत्ती","तना","फूल"],a:1,exp:"Leaves contain chlorophyll, which captures sunlight for photosynthesis.",exp_hi:"पत्तियों में क्लोरोफिल होता है, जो प्रकाश-संश्लेषण के लिए सूर्य-प्रकाश ग्रहण करता है।",why:["जड़ पानी-खनिज सोखती है","तना परिवहन करता है","फूल प्रजनन के लिए है"],topic:"Biology",level:1,mode:"standard"}]},
{id:"ss-sources",subject:"ss",day:11,level:1,title:"Sources of History & Ancient Cultures",hi:"इतिहास के स्रोत व प्राचीन संस्कृतियाँ",
 concepts:[{title:"Knowing history — sources & early cultures",title_hi:"इतिहास जानना — स्रोत व प्रारम्भिक संस्कृतियाँ",
  intro:"Historians reconstruct the past from archaeological and literary sources, then study the Stone, Chalcolithic and Vedic cultures.",
  points:["पुरातात्विक स्रोत: सिक्के, अभिलेख, स्मारक, मूर्तियाँ, मृदभांड","साहित्यिक स्रोत: वेद, पुराण, विदेशी यात्रियों के वृत्तांत","सिंधु घाटी सभ्यता: हड़प्पा व मोहनजोदड़ो प्रमुख स्थल","ताम्रपाषाण (Chalcolithic) काल: पत्थर के साथ ताँबे का प्रयोग","वैदिक संस्कृति: ऋग्वेद सबसे प्राचीन वेद"],
  example:"मोहनजोदड़ो का अर्थ 'मृतकों का टीला'; यह अब पाकिस्तान (सिंध) में है।",
  trick:"स्रोत याद रखें: 'सिक्के-अभिलेख-स्मारक' = पुरातात्विक; 'वेद-पुराण-वृत्तांत' = साहित्यिक।",
  deep:{title:"Stone → Chalcolithic → Vedic sequence",title_hi:"पाषाण → ताम्रपाषाण → वैदिक क्रम",body:"पाषाण काल (पुरापाषाण, मध्यपाषाण, नवपाषाण) में पत्थर के औज़ार बनते थे। ताम्रपाषाण में ताँबा जुड़ा। फिर लोहा और वैदिक युग — जहाँ ऋग्वेद आदि की रचना हुई।",extra:"हड़प्पा सभ्यता काँस्य युगीन नगरीय सभ्यता थी; इसकी लिपि अब तक पढ़ी नहीं जा सकी।"},
  check:{q:"Which is the oldest Veda?",q_hi:"सबसे प्राचीन वेद कौन-सा है?",o:["Samaveda","Yajurveda","Rigveda","Atharvaveda"],o_hi:["सामवेद","यजुर्वेद","ऋग्वेद","अथर्ववेद"],a:2,exp:"The Rigveda is the oldest Veda.",exp_hi:"ऋग्वेद सबसे प्राचीन वेद है।"}}],
 questions:[
 {q:"Which of these is an archaeological source of history?",q_hi:"इनमें से कौन-सा इतिहास का पुरातात्विक स्रोत है?",o:["Inscriptions","Puranas","Vedas","Foreign accounts"],o_hi:["अभिलेख","पुराण","वेद","विदेशी वृत्तांत"],a:0,exp:"Inscriptions (and coins/monuments) are archaeological sources; the others are literary.",exp_hi:"अभिलेख (व सिक्के/स्मारक) पुरातात्विक स्रोत हैं; शेष साहित्यिक हैं।",why:["पुराण साहित्यिक स्रोत है","वेद साहित्यिक स्रोत है","विदेशी वृत्तांत साहित्यिक स्रोत है"],topic:"Sources of history",level:1,mode:"standard"},
 {q:"Mohenjo-daro, a major Indus Valley site, is located in which present-day country?",q_hi:"सिंधु घाटी का प्रमुख स्थल मोहनजोदड़ो किस वर्तमान देश में है?",o:["India","Pakistan","Bangladesh","Afghanistan"],o_hi:["भारत","पाकिस्तान","बांग्लादेश","अफ़गानिस्तान"],a:1,exp:"Mohenjo-daro is in the Sindh province of Pakistan.",exp_hi:"मोहनजोदड़ो पाकिस्तान के सिंध प्रांत में है।",why:["भारत में हड़प्पा-कालीन स्थल हैं पर मोहनजोदड़ो नहीं","बांग्लादेश में नहीं","अफ़गानिस्तान में नहीं"],topic:"Indus Valley",level:1,mode:"standard"},
 {q:"The Chalcolithic age is characterised by the use of:",q_hi:"ताम्रपाषाण काल की विशेषता किसका प्रयोग है?",o:["Only stone","Copper and stone","Only iron","Bronze and iron"],o_hi:["केवल पत्थर","ताँबा और पत्थर","केवल लोहा","काँसा और लोहा"],a:1,exp:"'Chalcolithic' means copper (chalco) + stone (lithic).",exp_hi:"'ताम्रपाषाण' = ताँबा (chalco) + पत्थर (lithic)।",why:["केवल पत्थर पाषाण काल है","केवल लोहा लौह युग है","काँसा+लोहा अलग चरण है"],topic:"Early cultures",level:1,mode:"standard"},
 {q:"The Vedic culture is named after the:",q_hi:"वैदिक संस्कृति का नाम किस पर पड़ा है?",o:["Vedas","Indus river","Vedic kings","Upanishads only"],o_hi:["वेदों","सिंधु नदी","वैदिक राजाओं","केवल उपनिषदों"],a:0,exp:"The Vedic culture is named after the four Vedas, the oldest texts.",exp_hi:"वैदिक संस्कृति का नाम चार वेदों (प्राचीनतम ग्रंथों) पर पड़ा है।",why:["सिंधु नदी से सिंधु सभ्यता का नाम पड़ा","राजाओं से नहीं","उपनिषद वेदों का बाद का भाग हैं"],topic:"Vedic culture",level:1,mode:"standard"}]},

{id:"ss-early",subject:"ss",day:12,level:1,title:"Early States & Mauryan Empire",hi:"प्रारम्भिक राज्य व मौर्य साम्राज्य",
 concepts:[{title:"6th century BCE & the Mauryas",title_hi:"छठी सदी ई.पू. व मौर्य",

 {q:"After which Mughal emperor did the empire's decline begin?",q_hi:"किस मुगल सम्राट के बाद साम्राज्य का पतन शुरू हुआ?",o:["Akbar","Shah Jahan","Aurangzeb","Jahangir"],o_hi:["अकबर","शाहजहाँ","औरंगज़ेब","जहाँगीर"],a:2,exp:"Aurangzeb's long wars and policies led to the empire's decline after his death (1707).",exp_hi:"औरंगज़ेब के लंबे युद्धों व नीतियों के कारण उसकी मृत्यु (1707) के बाद साम्राज्य का पतन हुआ।",why:["अकबर के काल में साम्राज्य सुदृढ़ था","शाहजहाँ के बाद औरंगज़ेब आया","जहाँगीर प्रारम्भिक सम्राट थे"],topic:"Mughal decline",level:1,mode:"standard"}]},

{id:"ss-british",subject:"ss",day:16,level:2,title:"European Powers & British Rule",hi:"यूरोपीय शक्तियाँ व अंग्रेज़ी राज्य",
 concepts:[{title:"European arrival & company expansion",title_hi:"यूरोपीय आगमन व कम्पनी विस्तार",
  intro:"How European powers arrived and the British East India Company established its rule.",
  points:["वास्को-डि-गामा: 1498 में कालीकट पहुँचे (समुद्री मार्ग से पहला यूरोपीय)","प्लासी का युद्ध (1757): क्लाइव ने सिराजुद्दौला को हराया","बक्सर का युद्ध (1764): ईस्ट इंडिया कम्पनी की जीत","सहायक संधि (Subsidiary Alliance): लॉर्ड वेलेज़ली","भारत में आने का क्रम: पुर्तगाली → डच → अंग्रेज़ → फ़्रांसीसी"],
  example:"प्लासी के युद्ध के बाद कम्पनी को बंगाल पर प्रभावी नियंत्रण मिला।",
  trick:"'प्लासी 1757, बक्सर 1764' — दो तिथियाँ रट लें; दोनों क्लाइव से जुड़ी हैं।",
  deep:{title:"Subsidiary Alliance & Doctrine of Lapse",title_hi:"सहायक संधि व व्यपगत सिद्धांत",body:"वेलेज़ली की सहायक संधि में राज्य को ब्रिटिश सेना रखनी पड़ती थी और बदले में संरक्षण मिलता था। बाद में डलहौज़ी का 'व्यपगत सिद्धांत' (Doctrine of Lapse) — गोद लिए उत्तराधिकारी को राज्य न देकर राज्य हड़पना।",extra:"इसी व्यपगत सिद्धांत के कारण झाँसी, सतारा जैसे राज्य हड़पे गए।"},
  check:{q:"Who reached Calicut by sea in 1498?",q_hi:"1498 में समुद्री मार्ग से कालीकट कौन पहुँचा?",o:["Columbus","Vasco da Gama","Magellan","Captain Cook"],o_hi:["कोलंबस","वास्को-डि-गामा","मैगलन","कैप्टन कुक"],a:1,exp:"Vasco da Gama reached Calicut in 1498.",exp_hi:"वास्को-डि-गामा 1498 में कालीकट पहुँचे।"}}],
 questions:[
 {q:"The Battle of Plassey (1757) was fought between:",q_hi:"प्लासी का युद्ध (1757) किसके बीच हुआ?",o:["Clive and Siraj-ud-Daulah","Clive and Tipu Sultan","Wellesley and Marathas","Cornwallis and Mysore"],o_hi:["क्लाइव और सिराजुद्दौला","क्लाइव और टीपू सुल्तान","वेलेज़ली और मराठे","कॉर्नवालिस और मैसूर"],a:0,exp:"Robert Clive defeated Siraj-ud-Daulah at Plassey in 1757.",exp_hi:"रॉबर्ट क्लाइव ने 1757 में प्लासी में सिराजुद्दौला को हराया।",why:["टीपू सुल्तान मैसूर का शासक था","वेलेज़ली सहायक संधि से जुड़े हैं","कॉर्नवालिस स्थायी बंदोबस्त से जुड़े हैं"],topic:"British rule",level:1,mode:"standard"},
 {q:"The Subsidiary Alliance was introduced by:",q_hi:"सहायक संधि किसने लागू की?",o:["Lord Dalhousie","Lord Wellesley","Lord Cornwallis","Warren Hastings"],o_hi:["लॉर्ड डलहौज़ी","लॉर्ड वेलेज़ली","लॉर्ड कॉर्नवालिस","वॉरेन हेस्टिंग्स"],a:1,exp:"Lord Wellesley introduced the Subsidiary Alliance system.",exp_hi:"लॉर्ड वेलेज़ली ने सहायक संधि प्रणाली लागू की।",why:["डलहौज़ी व्यपगत सिद्धांत से जुड़े हैं","कॉर्नवालिस स्थायी बंदोबस्त से जुड़े हैं","हेस्टिंग्स प्रथम गवर्नर-जनरल थे"],topic:"British policy",level:1,mode:"standard"},
 {q:"The Battle of Buxar was fought in which year?",q_hi:"बक्सर का युद्ध किस वर्ष लड़ा गया?",o:["1757","1760","1764","1772"],o_hi:["1757","1760","1764","1772"],a:2,exp:"The Battle of Buxar was fought in 1764.",exp_hi:"बक्सर का युद्ध 1764 में लड़ा गया।",why:["1757 प्लासी का वर्ष है","1760 गलत है","1772 गलत है"],topic:"British rule",level:1,mode:"standard"},
 {q:"Which European power was the FIRST to arrive in India?",q_hi:"भारत में सबसे पहले कौन-सी यूरोपीय शक्ति आई?",o:["British","French","Portuguese","Dutch"],o_hi:["अंग्रेज़","फ़्रांसीसी","पुर्तगाली","डच"],a:2,exp:"The Portuguese (Vasco da Gama, 1498) were the first to arrive.",exp_hi:"पुर्तगाली (वास्को-डि-गामा, 1498) सबसे पहले आए।",why:["अंग्रेज़ बाद में आए","फ़्रांसीसी बाद में आए","डच पुर्तगालियों के बाद आए"],topic:"European arrival",level:1,mode:"standard"}]},

 {q:"The three tiers of Panchayati Raj are:",q_hi:"पंचायती राज के तीन स्तर हैं:",o:["Gram Panchayat, Panchayat Samiti, Zila Parishad","Gram Sabha, Lok Sabha, Rajya Sabha","Village, Block, State","Panchayat, Municipality, Corporation"],o_hi:["ग्राम पंचायत, पंचायत समिति, ज़िला परिषद","ग्राम सभा, लोकसभा, राज्यसभा","गाँव, ब्लॉक, राज्य","पंचायत, नगर पालिका, निगम"],a:0,exp:"The three tiers are Gram Panchayat, Panchayat Samiti and Zila Parishad.",exp_hi:"तीन स्तर हैं ग्राम पंचायत, पंचायत समिति और ज़िला परिषद।",why:["ग्राम सभा/लोकसभा/राज्यसभा अलग निकाय हैं","गाँव/ब्लॉक/राज्य सही क्रम नहीं","पंचायत/पालिका/निगम ग्रामीण+नगरीय मिश्रण है"],topic:"Panchayati Raj",level:1,mode:"standard"},
 {q:"Which amendment gave constitutional status to Panchayati Raj?",q_hi:"पंचायती राज को संवैधानिक दर्जा किस संशोधन ने दिया?",o:["42nd","73rd","74th","86th"],o_hi:["42वाँ","73वाँ","74वाँ","86वाँ"],a:1,exp:"The 73rd Amendment (1992) gave constitutional status to Panchayati Raj.",exp_hi:"73वें संशोधन (1992) ने पंचायती राज को संवैधानिक दर्जा दिया।",why:["42वाँ आपातकाल से जुड़ा है","74वाँ नगरपालिकाओं से जुड़ा है","86वाँ शिक्षा के अधिकार से जुड़ा है"],topic:"Panchayati Raj",level:1,mode:"standard"}]},
{id:"ss-constitution",subject:"ss",day:19,level:1,title:"Constitution & Governance",hi:"संविधान व शासन व्यवस्था",
 concepts:[{title:"Our Constitution & democracy",title_hi:"हमारा संविधान व लोकतंत्र",
  intro:"The structure of India's Constitution, central and state governance, and democracy.",
  points:["संविधान अंगीकरण: 26 नवंबर 1949; लागू: 26 जनवरी 1950","प्रस्तावना (Preamble) की शुरुआत: 'हम, भारत के लोग…'","संघ की विधायिका: संसद (लोकसभा + राज्यसभा)","राज्य का कार्यकारी प्रमुख: राज्यपाल (वास्तविक: मुख्यमंत्री)","गणतंत्र दिवस: 26 जनवरी"],
  example:"भारत एक संप्रभु, समाजवादी, धर्मनिरपेक्ष, लोकतांत्रिक गणराज्य है।",
  trick:"'26 नवंबर = बनाया, 26 जनवरी = लागू' — संविधान की दो तिथियाँ अलग-अलग याद रखें।",
  deep:{title:"Fundamental structure of government",title_hi:"शासन की मूल संरचना",body:"भारत में संसदीय प्रणाली है: कार्यपालिका (राष्ट्रपति+मंत्रिपरिषद), विधायिका (संसद/विधानसभा), न्यायपालिका (सर्वोच्च न्यायालय)। केन्द्र-राज्य के बीच शक्ति का विभाजन तीन सूचियों (संघ, राज्य, समवर्ती) से होता है।",extra:"लोकसभा की अधिकतम सदस्य संख्या 552 (वर्तमान में 543 निर्वाचित); राज्यसभा की 250।"},
  check:{q:"When did the Constitution of India come into force?",q_hi:"भारत का संविधान कब लागू हुआ?",o:["15 August 1947","26 November 1949","26 January 1950","2 October 1950"],o_hi:["15 अगस्त 1947","26 नवंबर 1949","26 जनवरी 1950","2 अक्टूबर 1950"],a:2,exp:"The Constitution came into force on 26 January 1950.",exp_hi:"संविधान 26 जनवरी 1950 को लागू हुआ।"}}],
 questions:[
 {q:"The Preamble of the Indian Constitution begins with:",q_hi:"भारतीय संविधान की प्रस्तावना किससे शुरू होती है?",o:["We, the people of India","In the name of God","By the order of the King","We, the citizens of Bharat"],o_hi:["हम, भारत के लोग","ईश्वर के नाम पर","राजा के आदेश से","हम, भारत के नागरिक"],a:0,exp:"The Preamble begins with 'We, the people of India…'.",exp_hi:"प्रस्तावना 'हम, भारत के लोग…' से शुरू होती है।",why:["ईश्वर के नाम से नहीं","राजा का कोई उल्लेख नहीं","'नागरिक' नहीं, 'लोग' शब्द है"],topic:"Constitution",level:1,mode:"standard"},
 {q:"The Parliament of India consists of:",q_hi:"भारत की संसद में शामिल हैं:",o:["Lok Sabha and Rajya Sabha","Lok Sabha only","Rajya Sabha only","Lok Sabha, Rajya Sabha and President"],o_hi:["लोकसभा और राज्यसभा","केवल लोकसभा","केवल राज्यसभा","लोकसभा, राज्यसभा और राष्ट्रपति"],a:3,exp:"Parliament consists of the President, Lok Sabha and Rajya Sabha.",exp_hi:"संसद में राष्ट्रपति, लोकसभा और राज्यसभा शामिल हैं।",why:["केवल दो सदन अधूरा उत्तर है","केवल लोकसभा गलत है","केवल राज्यसभा गलत है"],topic:"Parliament",level:2,mode:"standard"},
 {q:"Who is the constitutional head of a state?",q_hi:"राज्य का संवैधानिक प्रमुख कौन है?",o:["Chief Minister","Governor","President","Chief Justice"],o_hi:["मुख्यमंत्री","राज्यपाल","राष्ट्रपति","मुख्य न्यायाधीश"],a:1,exp:"The Governor is the constitutional head of a state.",exp_hi:"राज्यपाल राज्य का संवैधानिक प्रमुख होता है।",why:["मुख्यमंत्री कार्यकारी प्रमुख है","राष्ट्रपति संघ का प्रमुख है","मुख्य न्यायाधीश न्यायपालिका का है"],topic:"Governance",level:1,mode:"standard"},
 {q:"India is a republic because:",q_hi:"भारत एक गणराज्य है क्योंकि:",o:["It has a monarch","The head of state is elected","It has a parliament","It is a democracy"],o_hi:["वहाँ राजा है","राज्य का प्रमुख निर्वाचित है","संसद है","लोकतंत्र है"],a:1,exp:"In a republic, the head of state (President) is elected, not hereditary.",exp_hi:"गणराज्य में राज्य का प्रमुख (राष्ट्रपति) निर्वाचित होता है, वंशानुगत नहीं।",why:["भारत में राजा नहीं है","संसद होना गणराज्य की परिभाषा नहीं","लोकतंत्र अलग अवधारणा है"],topic:"Democracy",level:2,mode:"standard"}]},

{id:"ss-security",subject:"ss",day:20,level:1,title:"National Security & Civic Safety",hi:"राष्ट्रीय सुरक्षा व नागरिक सुरक्षा",
 concepts:[{title:"Security, foreign policy & safety",title_hi:"सुरक्षा, विदेश नीति व सुरक्षा",
  intro:"India's national security, foreign policy, global role, and civic safety measures.",
  points:["सशस्त्र बलों के सर्वोच्च कमांडर: राष्ट्रपति","भारत की विदेश नीति का मूल: गुटनिरपेक्षता (Non-alignment) व पंचशील","संयुक्त राष्ट्र (UN) का मुख्यालय: न्यूयॉर्क","नागरिक सुरक्षा: आपदा के समय नागरिकों की सुरक्षा की व्यवस्था","यातायात सुरक्षा: हेलमेट, सीट-बेल्ट, गति-सीमा व ट्रैफ़िक नियम"],
  example:"पंचशील के पाँच सिद्धांत (1954) भारत-चीन समझौते से जुड़े हैं।",
  trick:"'राष्ट्रपति = सर्वोच्च कमांडर' — संवैधानिक प्रमुख ही सेना प्रमुख भी।",
  deep:{title:"Civil defence & disability rights",title_hi:"नागरिक सुरक्षा व दिव्यांग अधिकार",body:"नागरिक सुरक्षा (Civil Defence) युद्ध/आपदा के समय जान-माल की रक्षा की स्वयंसेवी व्यवस्था है। दिव्यांगता (Disability) के संदर्भ में RPwD अधिनियम 2016 समान अधिकार व समावेशन सुनिश्चित करता है।",extra:"सड़क सुरक्षा हेतु 'सड़क सुरक्षा सप्ताह' प्रतिवर्ष जनवरी में मनाया जाता है।"},
  check:{q:"Who is the Supreme Commander of the Indian armed forces?",q_hi:"भारतीय सशस्त्र बलों का सर्वोच्च कमांडर कौन है?",o:["Prime Minister","Defence Minister","President","Chief of Defence Staff"],o_hi:["प्रधानमंत्री","रक्षा मंत्री","राष्ट्रपति","चीफ ऑफ डिफेंस स्टाफ"],a:2,exp:"The President is the Supreme Commander of the armed forces.",exp_hi:"राष्ट्रपति सशस्त्र बलों का सर्वोच्च कमांडर है।"}}],
 questions:[
 {q:"The headquarters of the United Nations is located in:",q_hi:"संयुक्त राष्ट्र का मुख्यालय कहाँ स्थित है?",o:["Geneva","New York","Paris","London"],o_hi:["जिनेवा","न्यूयॉर्क","पेरिस","लंदन"],a:1,exp:"The UN headquarters is in New York, USA.",exp_hi:"संयुक्त राष्ट्र का मुख्यालय न्यूयॉर्क, अमेरिका में है।",why:["जिनेवा में UN का यूरोपीय कार्यालय है","पेरिस UNESCO का मुख्यालय है","लंदन में नहीं है"],topic:"Global community",level:1,mode:"standard"},
 {q:"India's foreign policy is based on the principle of:",q_hi:"भारत की विदेश नीति किस सिद्धांत पर आधारित है?",o:["Military alliance","Non-alignment","Colonialism","Isolation"],o_hi:["सैन्य गठबंधन","गुटनिरपेक्षता","उपनिवेशवाद","अलगाव"],a:1,exp:"India follows the policy of non-alignment (Panchsheel).",exp_hi:"भारत गुटनिरपेक्षता (पंचशील) की नीति अपनाता है।",why:["भारत किसी सैन्य गुट में नहीं","उपनिवेशवाद तो विरोधी विचार है","अलगाव की नीति नहीं है"],topic:"Foreign policy",level:1,mode:"standard"},
 {q:"Wearing a helmet while riding a two-wheeler is primarily a matter of:",q_hi:"दोपहिया वाहन चलाते समय हेलमेट पहनना मुख्यतः किससे संबंधित है?",o:["Fashion","Road safety","Speed","Fuel saving"],o_hi:["फ़ैशन","सड़क सुरक्षा","गति","ईंधन बचत"],a:1,exp:"Helmets protect riders from head injuries — a road-safety measure.",exp_hi:"हेलमेट सवार को सिर की चोट से बचाता है — यह सड़क-सुरक्षा उपाय है।",why:["फ़ैशन का उद्देश्य नहीं","गति से संबंध नहीं","ईंधन बचत से संबंध नहीं"],topic:"Road safety",level:1,mode:"standard"},
 {q:"The RPwD Act, 2016 in India relates to:",q_hi:"भारत में RPwD अधिनियम, 2016 किससे संबंधित है?",o:["Road transport","Persons with disabilities","Civil defence","Foreign trade"],o_hi:["सड़क परिवहन","दिव्यांग व्यक्ति","नागरिक सुरक्षा","विदेश व्यापार"],a:1,exp:"The Rights of Persons with Disabilities (RPwD) Act, 2016 protects disability rights.",exp_hi:"दिव्यांग व्यक्तियों के अधिकार अधिनियम (RPwD), 2016 दिव्यांगता अधिकारों की रक्षा करता है।",why:["सड़क परिवहन अलग विषय है","नागरिक सुरक्षा अलग विषय है","विदेश व्यापार अलग विषय है"],topic:"Disability",level:1,mode:"standard"}]},

{id:"ss-earth",subject:"ss",day:21,level:1,title:"Earth, Globe & Landforms",hi:"पृथ्वी, ग्लोब व स्थलरूप",
 concepts:[{title:"Earth in the solar system",title_hi:"सौरमण्डल में पृथ्वी",
  intro:"The Earth's place in the solar system, its motions, mapping and major landforms.",
  points:["सबसे बड़ा ग्रह: बृहस्पति (Jupiter)","पृथ्वी की दैनिक गति: घूर्णन (rotation) — 24 घंटे","पृथ्वी की वार्षिक गति: परिक्रमण (revolution) — 365¼ दिन","भूमध्य रेखा (Equator): 0° अक्षांश; मुख्य मध्याह्न: 0° देशांतर (ग्रीनविच)","पृथ्वी की परतें: भूपर्पटी (crust), मेंटल, क्रोड (core)"],
  example:"स्थलमण्डल (Lithosphere) = पृथ्वी का ठोस बाहरी भाग (भूपर्पटी व ऊपरी मेंटल)।",
  trick:"'बृहस्पति बड़ा, शनि सुंदर (छल्ले)' — ग्रहों की पहचान याद रखें।",
  deep:{title:"Motions & mapping basics",title_hi:"गतियाँ व मानचित्रण मूल बातें",body:"घूर्णन से दिन-रात बनते हैं; परिक्रमण व झुकाव (23.5°) से ऋतुएँ बनती हैं। अक्षांश (latitude) भूमध्य रेखा से उत्तर-दक्षिण, देशांतर (longitude) ग्रीनविच से पूर्व-पश्चिम मापता है।",extra:"स्थलरूप: पर्वत, पठार, मैदान — ये पृथ्वी की आंतरिक व बाह्य शक्तियों से बनते हैं।"},
  check:{q:"Which is the largest planet in the solar system?",q_hi:"सौरमण्डल का सबसे बड़ा ग्रह कौन-सा है?",o:["Earth","Saturn","Jupiter","Mars"],o_hi:["पृथ्वी","शनि","बृहस्पति","मंगल"],a:2,exp:"Jupiter is the largest planet.",exp_hi:"बृहस्पति सबसे बड़ा ग्रह है।"}}],
 questions:[
 {q:"The rotation of the Earth causes:",q_hi:"पृथ्वी के घूर्णन से क्या बनता है?",o:["Seasons","Day and night","Months","Years"],o_hi:["ऋतुएँ","दिन और रात","महीने","वर्ष"],a:1,exp:"Earth's rotation on its axis causes day and night.",exp_hi:"पृथ्वी का अपने अक्ष पर घूर्णन दिन-रात बनाता है।",why:["ऋतुएँ परिक्रमण व झुकाव से बनती हैं","महीने चंद्रमा से जुड़े हैं","वर्ष परिक्रमण से बनता है"],topic:"Earth motions",level:1,mode:"standard"},
 {q:"The 0° latitude is known as:",q_hi:"0° अक्षांश को क्या कहते हैं?",o:["Prime Meridian","Equator","Tropic of Cancer","North Pole"],o_hi:["मुख्य मध्याह्न","भूमध्य रेखा","कर्क रेखा","उत्तरी ध्रुव"],a:1,exp:"0° latitude is the Equator.",exp_hi:"0° अक्षांश भूमध्य रेखा है।",why:["मुख्य मध्याह्न 0° देशांतर है","कर्क रेखा 23.5° उत्तर है","उत्तरी ध्रुव 90° उत्तर है"],topic:"Globe",level:1,mode:"standard"},
 {q:"The outermost solid layer of the Earth is called the:",q_hi:"पृथ्वी की सबसे बाहरी ठोस परत कहलाती है:",o:["Mantle","Core","Crust","Lithosphere"],o_hi:["मेंटल","क्रोड","भूपर्पटी","स्थलमण्डल"],a:2,exp:"The crust is the Earth's outermost solid layer.",exp_hi:"भूपर्पटी (crust) पृथ्वी की सबसे बाहरी ठोस परत है।",why:["मेंटल भूपर्पटी के नीचे है","क्रोड सबसे भीतर है","स्थलमण्डल भूपर्पटी+ऊपरी मेंटल का संयुक्त भाग है"],topic:"Earth structure",level:2,mode:"standard"},
 {q:"How long does the Earth take to complete one revolution around the Sun?",q_hi:"पृथ्वी सूर्य का एक चक्कर कितने समय में पूरा करती है?",o:["24 hours","30 days","365¼ days","12 hours"],o_hi:["24 घंटे","30 दिन","365¼ दिन","12 घंटे"],a:2,exp:"Earth takes about 365¼ days to revolve around the Sun.",exp_hi:"पृथ्वी सूर्य का एक चक्कर लगभग 365¼ दिन में लगाती है।",why:["24 घंटे घूर्णन का समय है","30 दिन चंद्रमा की परिक्रमा है","12 घंटे गलत है"],topic:"Earth motions",level:1,mode:"standard"}]},

{id:"ss-indiageo",subject:"ss",day:22,level:1,title:"India: Physical & Economic Geography",hi:"भारत: भौतिक व आर्थिक भूगोल",
 concepts:[{title:"Physical features, soil, climate & resources",title_hi:"भौतिक स्वरूप, मृदा, जलवायु व संसाधन",

const APP={};
APP.setLang=l=>{document.body.setAttribute("data-lang",l);$$(".seg button").forEach(b=>b.classList.toggle("on",b.dataset.l===l));};
APP.fs=()=>{const f=parseInt(document.documentElement.getAttribute("data-fs"));const n=f>=3?1:f+1;document.documentElement.setAttribute("data-fs",n);toast("Font size: "+["S","M","L"][n-1]);};
APP.theme=()=>{const d=document.documentElement;const t=d.getAttribute("data-theme")==="dark"?"light":"dark";d.setAttribute("data-theme",t);};
APP.motion=()=>{const d=document.documentElement;const t=d.getAttribute("data-motion")==="off"?"on":"off";d.setAttribute("data-motion",t);toast("Motion "+(t==="off"?"OFF":"ON"));};
APP.toggleNav=()=>{document.querySelector("header").classList.toggle("nav-open");};

    </div>
    <div class="doors" style="grid-template-columns:repeat(auto-fill,minmax(240px,1fr));margin-top:14px">
      ${mods.map(m=>{
        const isDone=S.done.includes(m.id);

}
function mpRender(){
  const m=MP.m, step=MP.i;
  const s=SUBJECTS.find(x=>x.id===m.subject);
  const stLabels=[bi("1 · Core Concept","1 · मूल अवधारणा"),bi("2 · Concept Check","2 · Concept Check"),bi("3 · Deep Dive","3 · Deep Dive"),bi("4 · Diagnostic Quiz","4 · Diagnostic Quiz")];

function mpConcept(m){

/* ---------- Diagnostic Quiz (module step 4) ---------- */
function mpQuiz(m){
  const qs=m.questions;
  return `<span class="tag t-grn">${bi("Diagnostic Quiz","Diagnostic Quiz")}</span>
    <h2 class="sec" style="margin:10px 0">${bi("Readiness Check","Readiness Check")}</h2>

    <div class="qcard" style="margin-top:14px" id="dqBox"></div>
    <div class="mp-nav" id="dqNav"></div>`;
}
function mpQuizRender(){
  MP.quizQ=MP.quizQ||0;MP.quizAnswers=MP.quizAnswers||[];
  const qs=MP.m.questions, i=MP.quizQ, q=qs[i];
  const doneAll=i>=qs.length;
  const el=$("#dqBox"), nav=$("#dqNav");
  if(doneAll){mpQuizResult(el,nav);return;}
  el.innerHTML=`<div class="qhead"><span class="qnum">${bi("Question","प्रश्न")} ${i+1} / ${qs.length}</span><span class="tag t-blue">${q.mode==="deepseek"?"🧠 Deep":"⚡ Quick"}</span></div>
    <div class="qtext">${q.q_hi?bi(q.q,q.q_hi):q.q}</div>
    ${(q.o_hi||q.o).map((o,j)=>`<button class="opt" onclick="APP.dqAnswer(${j})">${label(o,j,q)}</button>`).join("")}
    <div id="dqRationale"></div>`;
  nav.innerHTML=`<div></div><button class="btn" id="dqNext" style="display:none" onclick="APP.dqNext()">${bi("Next","आगे")} →</button>`;
}
APP.dqAnswer=j=>{
  const qs=MP.m.questions, i=MP.quizQ, q=qs[i];
  if(MP.quizAnswers[i]!=null)return;
  MP.quizAnswers[i]=j;
  const ok=j===q.a;
  const opts=$$("#dqBox .opt");
  opts.forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add("ok");if(k===j&&!ok)b.classList.add("no");});
  $("#dqRationale").innerHTML=rationaleHTML(q,ok);
  if(ok)give(10,"+10 XP ✅");
  const nxt=$("#dqNext");if(nxt){nxt.style.display="";nxt.textContent=i+1>=qs.length?bi("See Result","परिणाम देखें"):bi("Next","आगे")+" →";}
};
APP.dqNext=()=>{
  const qs=MP.m.questions;
  if(MP.quizQ+1>=qs.length){mpQuizRender();return;}
  MP.quizQ++;mpQuizRender();
};
function mpQuizResult(el,nav){
  const qs=MP.m.questions, ans=MP.quizAnswers;
  let cor=0;ans.forEach((a,i)=>{if(a===qs[i].a)cor++;});
  const pct=Math.round(cor/qs.length*100);
  const pass=pct>=70;
  if(!S.done.includes(MP.m.id)&&pass){S.done.push(MP.m.id);S.perDay[MP.m.day]=1;award("start");checkBadges();}
  // track weak topics
  ans.forEach((a,i)=>{const q=qs[i];if(a!==q.a){S.weak[q.topic]=(S.weak[q.topic]||0)+1;S.mistakes.push({m:MP.m.id,q:i,topic:q.topic,ts:Date.now()});}});
  save();
  el.innerHTML=`<div style="text-align:center;padding:20px 0">
    <div style="font-size:3rem">${pass?"🎉":"📚"}</div>
    <h2 class="sec">${cor} / ${qs.length} (${pct}%)</h2>
    <p class="sub">${pass?bi("Passed! This module is complete.","Pass! यह module पूर्ण हो गया।") : bi("Below 70% — review and retry to unlock the next day.","70% से कम — दोबारा देखें व retry करें।")}</p>
    <div class="bar" style="max-width:280px;margin:14px auto"><i style="width:${pct}%;background:${pass?"var(--green)":"var(--gold)"}"></i></div>
  </div>`;
  nav.innerHTML=`<div><a class="btn ghost" href="#/subjects">${bi("Exit","बाहर")}</a></div>
    ${pass?`<a class="btn" href="#/roadmap">${bi("Next Day","अगला दिन")} →</a>`:`<button class="btn gold" onclick="MP.quizQ=0;MP.quizAnswers=[];mpRender()">${bi("Retry Quiz","फिर से दें")} ↻</button>`}`;
  if(pass){confetti(innerWidth/2,innerHeight/2.4);award("quiz");}
}

/* ---------- rationale renderer ---------- */
function rationaleHTML(q,ok){
  const wrongOpts=[];
  for(let k=0;k<(q.o_hi||q.o).length;k++)if(k!==q.a)wrongOpts.push(k);
  const whys=(q.why||[]).slice(0,3);
  const correctText=label(q.a,q.a,q);
  return `<div class="rationale">
    <div class="rh">${ok?"✅ ":"❌ "}${bi("Correct answer:","सही उत्तर:")} ${correctText}</div>
    <div>${q.exp_hi?bi(q.exp,q.exp_hi):q.exp}</div>
    ${whys.length?`<ul class="why">${whys.map((w,i)=>`<li>${bi("Option","विकल्प")} ${String.fromCharCode(65+wrongOpts[i])}: ${w}</li>`).join("")}</ul>`:""}
  </div>`;
}

/* ---------- 30s review timer (Flash / DeepSeek) ---------- */
let REVIEW=null;
function review30(onDone,hostSel){
  clearInterval(REVIEW&&REVIEW.t);
  const host=$(hostSel);
  if(host)host.insertAdjacentHTML("beforeend",`<div class="reviewbar" id="reviewBar"><span class="rl">${bi("Review your answer","उत्तर की समीक्षा")}</span><b id="reviewCount">30s</b><button class="btn sm" onclick="APP.skipReview()">${bi("Next / Skip","आगे / छोड़ें")} →</button></div>`);
  let left=30;
  REVIEW={done:onDone,t:setInterval(()=>{left--;const c=$("#reviewCount");if(c)c.textContent=left+"s";if(left<=0)APP.skipReview();},1000)};
}
APP.skipReview=()=>{clearInterval(REVIEW&&REVIEW.t);const b=$("#reviewBar");if(b)b.remove();const d=REVIEW&&REVIEW.done;REVIEW=null;if(d)d();};

let DS=null;
function deepseekView(){

    <div class="mockbar"><span class="chip">${bi("Question","प्रश्न")} ${DS.i+1}/${DS.bank.length}</span><span class="chip">⭐ ${DS.cor} ${bi("correct","सही")}</span></div>

    </div>`;
}
APP.dsReveal=()=>{

      $("#dsReveal").textContent=bi("Answer Now","अब उत्तर दें");

    }
  }
};
APP.dsAnswer=j=>{
  const q=DS.bank[DS.i];
