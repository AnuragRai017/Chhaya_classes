# Daily content update — generates new GK/GS quizzes and practice questions for
# every section, then commits them back to the repo so the site always has fresh
# practice material.
#
# Required secret (repo Settings → Secrets and variables → Actions):
#   DEEPSEEK_API_KEY  — DeepSeek direct API key (https://platform.deepseek.com)
# Optional: OPENROUTER_API_KEY + OPENROUTER_MODEL for the --provider openrouter fallback.

name: Daily Content Update

on:
  schedule:
    # 01:30 UTC = 07:00 IST, every day
    - cron: "30 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-content:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create .env from secrets
        run: |
          {
            echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}"
            echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}"
            echo "OPENROUTER_MODEL=${{ vars.OPENROUTER_MODEL || 'deepseek/deepseek-chat' }}"
          } > .env

      - name: Generate daily content (Current Affairs + GK/GS + section rotation)
        run: node scripts/generate.mjs --daily --n 6

      - name: Commit and push generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/generated
          if git diff --cached --quiet; then
            echo "No content changes to commit."
          else
            git commit -m "content: daily update $(date -u +%F)"
            git push
          fi
